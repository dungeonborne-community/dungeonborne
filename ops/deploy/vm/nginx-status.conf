# 15.11 публичный статус сервера: https://status.dungeonborne-community.com/dbserver/status
# (бот Discord, сайт сообщества, лаунчер). DNS — у Squarespace (A status → 203.0.113.10), сертификат — Let's Encrypt
# (HTTP-01 через webroot). Наружу только GET /dbserver/status, остальное — 404. CORS ставит сам бэкенд
# ([web] status_cors). Блоки `server_name _` из sites-enabled/dungeonborne остаются серверами по умолчанию
# (лаунчер с пином самоподписанного сертификата и /auth/ на :80) — это имя их не задевает.
#
# Установка (по слову владельца):
#   apt-get install -y certbot && mkdir -p /var/www/acme
#   1) положить только блок :80 ниже → /etc/nginx/sites-available/dungeonborne-status, ссылка в sites-enabled,
#      nginx -t && systemctl reload nginx
#   2) certbot certonly --webroot -w /var/www/acme -d status.dungeonborne-community.com \
#        --agree-tos --register-unsafely-without-email -n --deploy-hook "systemctl reload nginx"
#   3) дописать блок :443, nginx -t && systemctl reload nginx. Продление — certbot.timer (ставится с пакетом).
#
# 16.11 цель сбора (донат-гол): /dbserver/support — файл, который пишет Discord-бот (bot.toml [fund] json_path),
# nginx отдаёт его сам. Каталог:
#   install -d -o discord-bot -g www-data -m 2750 /var/www/status
# Бот пишет support.json.tmp в том же каталоге с правами 0640 (umask 027), затем rename → support.json:
# setgid каталога даёт файлу группу www-data, nginx читает через группу. Наружу отдаётся только support.json.

# CORS для файлов, которые nginx отдаёт сам (тот же список, что [web] status_cors бэкенда — менять оба места)
map $http_origin $status_cors {
    default "";
    "https://www.dungeonborne-community.com"  $http_origin;
    "https://dungeonborne-community.com"      $http_origin;
    "https://test.dungeonborne-community.com" $http_origin;
    "http://localhost:8821"                   $http_origin;
}

server {
    listen 203.0.113.10:80;
    server_name status.dungeonborne-community.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 203.0.113.10:443 ssl;
    server_name status.dungeonborne-community.com;
    ssl_certificate     /etc/letsencrypt/live/status.dungeonborne-community.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.dungeonborne-community.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /dbserver/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # цель сбора: файла нет — 404; пустой $status_cors nginx не отправляет
    location = /dbserver/support {
        limit_except GET { deny all; }
        alias /var/www/status/support.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin $status_cors always;
        add_header Vary Origin always;
    }
    location / {
        return 404;
    }
}
