# Catalog of mods and paks (stage 2, docs/MODS_REFACTOR_PLAN.md; rules — docs/MODS_DESIGN.md §4).
# Answers the question "what is it, where is it built from and who gets it". `cargo xtask mods build` builds from it.
# Paths — from the backups root; a path with a drive letter is a source outside the repository (the build takes the ready file, check warns).
#
# kind:     ue4ss — a UE4SS mod folder (in Mods/<name>); pak — a game pak (Content/Paks/<name>.pak and .ucas/.utoc next to it)
# build:    copy — take as is (default); repak — build from the source folder (Dungeonborne/... inside)
# profiles: client — players (launcher packages), server — Robot, dev-client / dev-server — local installs
# side:     both (default) | server — server only, not allowed in client
# dev:      true — dev profiles only
# overrides: paks whose files this pak overrides deliberately (load order — by name)
# package:  the launcher package (launcher/tools/mods.json) this part belongs to
# requires: what it does not work without
# season:   part of a season (docs/SEASONS_FORMAT.md) — installed only when the season is active (seasons/active.txt or
#           --season=<id>); without the field — the base game. User's decision 07.11: lower relics — the playtest season;
#           the Jester instead of the Reaper — neither base nor playtest (no season assigned, dev for now)

# --- game tables and fixes --------------------------------------------------------------------------------------

[[item]]
id = "pak.li-patch"
kind = "pak"
name = "zz_LIPatch_P"
source = "game/bp-patches/build/pak/zz_LIPatch_P.pak"   # cargo ws dump paks --apply (patch_lipatch.py on your copy)
profiles = ["client", "server", "dev-client", "dev-server"]
package = "ru.li-patch"

[[item]]
