; DungeonborneDruidProbe — diagnostics of druid trees on the battle server (12.11). Stand only.
[druid]
enabled = 1
; search radius for mobs and heroes around the tree, cm
near_cm = 600
; 1 — hook on the native ApplyProjectileEffect (struct parameter, may crash the server); 0 — off.
apply_hook = 1
; 1 — experiment: set VisibilityBasedAnimTickOption = 0 on skeletons near the tree (bones without rendering)
fix_bones = 1
