; DungeonborneRuClient mod settings (docs/MOD_SETTINGS.md). Read at game start.
; The server wins: whatever came from the server in server_settings.ini (written by the launcher) applies; the rest is here.
; A line starting with ; or # is a comment. Missing keys use the default from the code (given in the comment).

[r14]
; R14 stub for pawns: off | all (default all; in the package for players — off)
mode = off

; [map]
; rules_keep = 0        ; 1 — leave the game's map options alone

; [teams]
; mode = party          ; party | coop

; [native]
; data_url =            ; backend URL for match data (battle server and stand); empty — no dbnative data
; realkey = 0
; keepopenid = 0
; noclose = 0
; init = 0              ; 1 — do not set HasInitedPlayerData (native InitPlayerGameData)

; [herofix]
; enabled = 1           ; 0 — disable client-side hero fixes

; [pvpleave]
; enabled = 1           ; 0 — no auto-exit after PVP

; [connect]
; timeout = 60          ; seconds until exit when connecting to a match hangs; 0 — disabled

; [diag]
; projectiles = 0       ; 1 — projectile log (may crash the client, debugging only)

; [stealth] — from the server (season, [client.DungeonborneRuClient.stealth]); here only for a stand without the launcher
