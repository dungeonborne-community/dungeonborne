# Workstation programs (like Cargo.lock): what is needed, which version and where from. docs/WORKSPACE_PLAN.md, sections 3, 9.
#   ws doctor    — check;  ws bootstrap — install what is missing.
#
# kind = "rust-target" — a rustup target of the workspace toolchain (`target`): rustup target list / add.
# kind = "uv-python"   — a portable CPython (`version`) put by uv (tool "uv", listed before it) into `to`; nothing goes
#                        into the system (--no-bin, --no-registry). A matching Python of the machine (check/expect) is fine too.
# kind = "system"   — installed into the system (installer, winget); ws only checks: check — command, expect — version regex,
#                     install — how to install. A full path can be set in local.toml [tools] <name>.
# kind = "copy"     — copy of a folder/file from -> to (to — in DB_HOME, "home:…"); exe — the main file, sha256 — its hash.
#                     "legacy:…" — the old <data> (local.toml [legacy] root), until there is a store (step 5).
# kind = "download" — url (+ archive_sha256), unzip = true — unpack into to (strip = N — without the top N folders of the archive);
#                     save_as — file name instead of the name from the url.
# kind = "cargo"    — exe — file in to, version — what "exe --version" must show. Two ways (choice:
#                     --prebuilt / --from-source of cargo xtask setup and ws bootstrap, otherwise local.toml [setup] build,
#                     otherwise prebuilt):
#                       prebuilt — [tool.prebuilt]: archive from the official releases page (url + archive_sha256),
#                                  unpacked into the exe folder, the exe is checked against sha256;
#                       source   — cargo install --locked <crate>@<version> --root to (from source, slower).
# profiles — for which DevKit profiles (owner, dev, designer, agent); absent — for all. required = false — not an error.
# components — needed only when one of these components is installed (config/components.toml, ws components);
#              absent — for every component.
# manual = true — ws doctor / bootstrap skip it; cargo xtask setup installs it when needed.
# visibility — team / owner: the entry does not go into the public edition (cargo xtask export public); absent — public.

# --- languages and build. Rust — MSVC target: either Visual Studio Build Tools in the system, or without them (bootstrap.ps1):
#     CRT and Windows SDK from cargo-xwin in home/cache/xwin, linker rust-lld, C/C++ and resources — LLVM below.
[[tool]]
name = "llvm"
kind = "download"
manual = true   # without Visual Studio — for Tauri windows (clang-cl, llvm-rc); libclang for the backend build (LIBCLANG_PATH = bin); installed by cargo xtask setup --tool=llvm
# .tar.xz, not .tar.zst: the LLVM zstd archive is built with a large window, Windows tar.exe cannot unpack it
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/clang%2Bllvm-23.1.5-x86_64-pc-windows-msvc.tar.xz"
archive_sha256 = "62fdada7f6fa2b73856486dfbbdba3d2c1882991621615bcb55c60207611c6d4"   # GitHub digest, 860 MB
unzip = true
strip = 1
to = "home:toolchains/llvm"
exe = "bin/clang-cl.exe"

[[tool]]
name = "rust"
kind = "system"
check = ["rustc", "--version"]
expect = 'rustc 1\.(8[5-9]|9\d)'
install = "rustup: https://rustup.rs (RUSTUP_HOME/CARGO_HOME in home/toolchains)"
profiles = ["owner", "dev", "agent"]

[[tool]]
name = "uv"
kind = "download"     # github.com/astral-sh/uv, release 0.13.4 (17.11: before — "install it from the website", newcomers did not have it)
url = "https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-pc-windows-msvc.zip"
archive_sha256 = "ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225"   # digest GitHub
unzip = true
to = "home:tools/uv"
exe = "uv.exe"
sha256 = "b9d9656370ee1812e53e985d8bbb81870038106df98ef34cb45bcf4e0fe0df17"
profiles = ["owner", "dev", "agent"]
required = false

[[tool]]
name = "python"
kind = "uv-python"     # 18.11: a portable CPython of this workspace, installed by uv (above: this tool must come after uv)
version = "3.12.15"    # the newest 3.12 that uv 0.13.4 knows; uv checks the download against its own checksums
to = "home:toolchains/python"   # -> home/toolchains/python/cpython-<version>-windows-x86_64-none/python.exe
check = ["python", "--version"] # a Python of your own that matches `expect` is fine too
expect = 'Python 3\.1[2-9]'
install = "ws bootstrap --apply: uv python install <version> --install-dir home/toolchains/python --no-bin --no-registry"
why = "tools/py and the site scripts; new PowerShell windows get it from home/env.ps1, AI agents as DB_PYTHON"
