# --- external programs (kind = "external"): large, installed by a human and only for specific work. ws does not install them;
#     doctor and DevKit show them "for work" (note): whether the program is present and what it is for. Lookup: local = "section.key"
#     (path in local.toml), env — variable with the folder, detect — command whose non-empty output = found.
[[tool]]
name = "visual-studio"
kind = "external"
for = "building dbnative.dll (game/ue4ss/native/dbnative/build.bat) and the Rust linker without cargo-xwin"
detect = ["%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe", "-latest", "-products", "*", "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "-property", "installationPath"]
install = "Visual Studio 2022+ or Build Tools, workload \"Desktop development with C++\" (the installer asks for admin rights)"
profiles = ["owner", "dev", "agent"]
components = ["mods"]

[[tool]]
name = "unreal-engine"
visibility = "team"   # game/unreal projects (the public edition has them too since 19.11)
kind = "external"
for = "game/unreal projects (Jester, new class): cook and paks, editor scripts"
local = "unreal.editor_cmd"
install = "Unreal Engine 5.1 (Epic Games Launcher, ~40 GB); path to UnrealEditor-Cmd.exe — config/local.toml [unreal] editor_cmd"
profiles = ["owner", "dev", "agent"]
components = ["unreal"]

[[tool]]
name = "ghidra"
visibility = "team"   # client analysis (the public edition has it too since 19.11)
kind = "external"
for = "analysing the client's native code from the exe image taken from a process dump (research/ghidra/README.md; the exe on disk is packed); the dump — via the owner's link"
path = "home:tools/ghidra/ghidraRun.bat"
local = "tools.ghidra"
env = "GHIDRA_INSTALL_DIR"
install = "cargo xtask setup --apply --tool=ghidra-dist,jdk (Ghidra 12.2 + JDK 21 in home, ~750 MB, no admin rights)"
profiles = ["owner", "dev", "agent"]
components = ["research"]

