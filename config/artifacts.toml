# Heavy and binary data outside git (like Cargo.lock for data). docs/WORKSPACE_PLAN.md, sections 3, 7.
#   ws doctor — check; ws bootstrap — copy what is missing from from and verify sha256.
#
# path    — where it lives: "home:…" (DB_HOME) or "ws:…" (in the working copy, in .gitignore)
# from    — where to take it from: "legacy:…" — the old <data> (local.toml [legacy] root) until the store (step 5)
# rebuild — how to recreate it if there is no source; value — reproducible (can be built) | irreplaceable (copy only)
# components — needed only when one of these components is installed (ws components); absent — "ws:<path>" follows the
#           component of the member holding the path, other paths are needed always.
# sha256  — for files; not set for folders. required = false — work goes on without it, but not all of it.

