# Secrets inventory (schema dbsecrets/1, docs/SECRETS.md). THERE ARE NO VALUES HERE AND THERE NEVER WILL BE.
# This is the framework contract: what the server needs. Each owner has their own values — in their vault
# (KeePassXC by default: local.toml [vault] path + db below). Work with them via ws secrets:
#   ws secrets list                      the inventory (without the vault)
#   ws secrets init                      a new database with groups and empty entries per the inventory (only if there is no file)
#   ws secrets check                     what is not yet filled in the database (values are not printed)
#   ws secrets export [--tier=team]      a new database with only team entries (its own password; on a developer machine
#                                        local.toml [vault] db = 'team.kdbx', tier = 'team')
#   ws secrets run <names|all> -- <command>   secrets into environment variables for the duration of the command:
#                                        value — the value in env; file — a file in a temp folder, the path in env
#   ws secrets unlock [--for=4h]         a vault session: the password once, then the session secrets go to the commands
#                                        in their session_for without asking (ws secrets status | lock)
#
# kind = "value": the value is the entry field `field` (Password by default)
# kind = "file":  the file is the entry attachment named `file`
# env — variable name for ws secrets run; used_by — workspace members; rotate — reissue on a new PC.
# visibility — who may receive the value: owner (owner only) or team (team database, ws secrets export);
# no field — owner.
# session = true — goes into the vault session (value kind, not owner); session_for — the only commands it is given to
# there: "ws dump" matches `ws dump …` and `cargo ws dump …` (docs/SECRETS.md, "Vault session").

schema = "dbsecrets/1"

[vault]
db = "dungeonborne.kdbx"

[[secret]]
name = "relay_tls_key"
group = "Prod VM"
visibility = "owner"
title = "Relay TLS key"
kind = "file"
file = "backend.key"
env = "RELAY_TLS_KEY"
used_by = ["core/backend", "ops/deploy"]
description = "Private TLS key of the launcher relay ([relay] key in the prod server.toml). Launchers pin its public key (TOFU)."
rotate = true

[[secret]]
name = "prod_dbserver_env"
group = "Prod VM"
visibility = "owner"
title = "dbserver.env"
kind = "file"
file = "dbserver.env"
env = "PROD_DBSERVER_ENV"
used_by = ["ops/deploy"]
description = "Prod backend environment for systemd dbserver (/opt/dungeonborne); secret inside: DISCORD_CLIENT_SECRET."
rotate = true

[[secret]]
name = "discord_client_secret"
group = "Discord"
visibility = "owner"
title = "OAuth client secret"
kind = "value"
field = "Password"
env = "DISCORD_CLIENT_SECRET"
used_by = ["core/backend", "tools/probe"]
description = "Secret of the Discord login OAuth app ([auth.discord] client_secret_env)."
rotate = true

[[secret]]
name = "release_signing_key"
group = "Launcher"
visibility = "owner"
title = "Release signing key"
kind = "file"
file = "release_key.secret"
env = "RELEASE_SIGNING_KEY"
used_by = ["apps/launcher"]
description = "Ed25519 seed that signs launcher releases (tools/release.py sign --key <file>); the public key is built into the launcher."
rotate = true

[[secret]]
name = "dist_signing_key"
group = "Launcher"
visibility = "owner"
title = "Dist signing key"
kind = "file"
file = "dist.key"
env = "DIST_SIGNING_KEY"
used_by = ["xtask"]
description = "minisign secret key for prebuilt ws and DevKit (cargo xtask dist --sign); the public key is xtask/dist.pub. Created by cargo xtask dist keygen."
required = false

[[secret]]
name = "discord_bot_env"
group = "Discord"
visibility = "owner"
title = "Bot"
kind = "file"
file = ".env"
env = "DISCORD_BOT_ENV"
used_by = ["ops/discord"]
description = "Discord bot .env: DISCORD_TOKEN, DISCORD_GUILD_ID, DEEPL_KEY."
rotate = true

[[secret]]
name = "game_aes_key"
group = "Game"
visibility = "team"   # 17.11, owner decision: the team needs the key for retoc, a leak is not critical
title = "Pak AES key"
kind = "value"
field = "Password"
env = "GAME_AES_KEY"
# 18.11: no longer copied into local.toml ([re] aes_key) - ws dump takes it from the vault session
session = true
session_for = ["ws dump"]
used_by = ["research", "tools/dumper"]
description = "Game pak key (the publisher's) for retoc. Unpacking paks only on a human's explicit word, even with the key at hand."
rotate = false

[[secret]]
name = "ssh_ed25519"
group = "Access"
visibility = "owner"
title = "SSH id_ed25519"
kind = "file"
file = "id_ed25519"
env = "SSH_ED25519"
used_by = ["ops/deploy"]
description = "SSH key of this PC: root@VM, and through it Administrator@Robot."
rotate = true

[[secret]]
name = "ssh_rsa"
group = "Access"
visibility = "owner"
title = "SSH id_rsa"
kind = "file"
file = "id_rsa"
env = "SSH_RSA"
used_by = ["ops/deploy"]
description = "Old SSH key: find out whether it is still used; if not, remove it from the servers."
required = false
rotate = true

[[secret]]
name = "ssh_ruvds_ingress"
group = "Access"
visibility = "owner"
title = "SSH ruvds_ingress"
kind = "file"
file = "ruvds_ingress"
env = "SSH_RUVDS_INGRESS"
used_by = ["ops/deploy"]
description = "SSH key of the ruvds ingress node (docs/RU_INGRESS_PLAN.md)."
required = false
rotate = true

[[secret]]
name = "restic_vm_password"
group = "Storage Box"
visibility = "owner"
title = "restic VM"
kind = "value"
field = "Password"
env = "RESTIC_PASSWORD"
used_by = ["ops/backup"]
description = "Password of the prod VM restic repository (on the VM: /root/.config/restic/password). Without it the backup cannot be restored."
rotate = false

[[secret]]
name = "restic_pc_password"
group = "Storage Box"
visibility = "owner"
title = "restic PC"
kind = "value"
field = "Password"
env = "RESTIC_PASSWORD"
used_by = ["ops/backup"]
description = "Password of this PC's restic repository (vault/restic-pc.password). Without it the backup cannot be restored."
rotate = false

[[secret]]
name = "storagebox_main"
group = "Storage Box"
visibility = "owner"
title = "Main account"
kind = "value"
field = "Password"
env = "STORAGEBOX_PASSWORD"
used_by = ["ops/backup"]
description = "Hetzner Storage Box main account uXXXXXX password (key access is the norm; password is the fallback)."
required = false
rotate = true

[[secret]]
name = "artifact_store"
group = "Storage Box"
visibility = "team"
title = "Artifacts (read-only)"
kind = "value"
field = "Password"
env = "ARTIFACT_STORE_PASSWORD"
session = true
session_for = ["ws bootstrap", "xtask setup"]
used_by = ["tools/ws"]
description = "Read-only sub-account of the artifact store (local.toml [store] url, user): ws bootstrap (with an open vault session, or ws secrets run artifact_store -- ws bootstrap)."
required = false
rotate = true

[[secret]]
name = "artifact_store_push"
group = "Storage Box"
visibility = "owner"
title = "Artifacts (write)"
kind = "value"
field = "Password"
env = "ARTIFACT_STORE_PUSH_PASSWORD"
used_by = ["tools/ws"]
description = "Sub-account with write access to the same folder (local.toml [store] push_url, push_user): ws artifacts push."
required = false
rotate = true
