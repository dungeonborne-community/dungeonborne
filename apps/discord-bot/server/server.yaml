# Rules on join: Discord shows them after onboarding; members can post only after "I agree".
# One language (English) — translations are in 📜・rules. Up to 16 items, each up to 300 characters, no markdown.
rules_screening:
  enabled: true
  description: "Dungeonborne Community — fan project, not affiliated with the developers or the publisher. Translations of the rules are in #📜・rules."
  rules:
    - "Be respectful. No harassment, hate speech or discrimination."
    - "No spam. No flooding, ads or unsolicited DMs."
    - "Right channel, right language. English in shared channels; in a language category, use its language. Forums take any language with a language tag."
    - "No cheats or exploits, no account trading. Found an exploit? Report it privately in #🎫・tickets."
    - "Launcher only from the official site, dungeonborne-community.com. No .exe files or links to \"other launchers\"."
    - "No NSFW, illegal content, malicious links or files."
    - "Follow the Discord Terms of Service and Community Guidelines. Moderators have the final word."

# Discord AutoMod: block the message, alert in mod-log, timeout. The script tracks rules by name
# (spam, keyword_preset, mention_spam, member_profile exist only once each — it finds them by type).
# keyword: up to 6 rules; keywords — up to 1000, each up to 60 characters, * at the start/end = part of a word;
# regex — up to 10 expressions (Rust syntax); allow — exceptions. Moderators are not checked (exempt_roles).
automod:
  alert_channel: "📋・mod-log"
  block_message: "Blocked by AutoMod. Wrong call? Open a ticket in #🎫・tickets / Ошибка? Открой тикет."
  exempt_roles: [Lead Moderator, Mod EN, Mod RU]
  rules:
    - name: "Block Mention Spam"   # the name the owner gave it in Discord
      trigger: mention_spam
      limit: 6
      raid_protection: true
      actions: [block, alert, { timeout: 600 }]

    - name: "Spam"
      trigger: spam
      actions: [block, alert]

    - name: "Slurs and sexual content"
      trigger: keyword_preset
      presets: [slurs, sexual_content]
      actions: [block, alert]

    - name: "Scam: free Nitro, fake Steam and Discord"
      trigger: keyword
      keywords:
        - "free nitro"
        - "nitro free"
        - "nitro for free"
        - "free discord nitro"
        - "бесплатный нитро"
        - "бесплатное нитро"
        - "нитро бесплатно"
        - "steam gift"
        - "*discord-gift*"
        - "*discordgift*"
        - "*dlscord*"
        - "*discorcl*"
        - "*disocrd*"
        - "*steamcommunlty*"
        - "*steamcomminuty*"
        - "*stearncommunity*"
        - "*steamconmunity*"
        - "*steampowered.ru*"
      regex:
        - '(?i)(free|бесплатн[а-я]*)[ .,:!-]{0,3}(crypto|usdt|btc|eth|скин[а-я]*|skins?)'
      actions: [block, alert, { timeout: 3600 }]

    - name: "Executables and foreign invites"
      trigger: keyword
      regex:
        # links to executable files (rule 5: the launcher only from the official site)
        - '(?i)https?://\S+\.(exe|scr|bat|cmd|msi|com|vbs|ps1|jar)(\?\S*)?(\s|$)'
        # invites to other servers
        - '(?i)(discord\.gg|discord(app)?\.com/invite)/[a-z0-9-]+'
      # official server invites — add here, e.g. "discord.gg/dungeonborne"
      allow: []
      actions: [block, alert]

    - name: "Impersonation in names"
      trigger: member_profile
      keywords:
        - "*moderator*"
        - "*admin*"
        - "*модератор*"
        - "*админ*"
        - "*dungeonborne team*"
        - "*dungeonborne official*"
        - "*support team*"
        - "*поддержка*"
      actions: [block, alert]

