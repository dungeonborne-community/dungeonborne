# Dungeonborne Community — structure v2 (per the "target Discord structure" document, team decisions of 14.11).
# Run: python setup_server.py [--guild ID] [--apply]
#
# was: old channel/role names — the script renames the existing one instead of creating a new one (history and members are kept).
# archive: channels move to 🗄️ ARCHIVE (visible to the team only, read-only); remove_roles / remove_channels — deletion.
# Permissions: allow / deny / reset per role; order: category → presets → channel perms → staff.
# Text channel and forum names — lowercase, no spaces. {server}, {#channel}, {@role} — substitutions in messages.

server:
  community: true
  rules_channel: "📜・rules"
  mod_updates_channel: "📋・mod-log"
  safety_alerts_channel: "📋・mod-log"   # Discord alerts about raids and spam spikes
  explicit_content_filter: all          # scan media from all members
  boost_progress_bar: true              # boost progress bar
  # 2FA for moderators (mfa_level) cannot be enabled by the bot — only by the owner with 2FA, manually
  verification_level: medium
  default_notifications: mentions
  preferred_locale: en-US
  description: "Play Dungeonborne again: a free community server with its own launcher, an open modding framework, guides and groups."

# The main server language is English. Others: translations of info messages in a "🌍 …" thread under the message
# (translations on the message) and a separate chat category that onboarding unlocks.
# Languages. category — the language category (visible with the role from onboarding): run by that language's community manager (manager);
# the bot keeps copies of the starter channels in that language there (message: <key>_ru). channels — which {#…} links
# in this category's texts point to its copies instead of the English channels.
languages:
  ru:
    flag: "🇷🇺"
    name: "Русский"
    category: "РУССКИЙ"
    manager: "RU Community Manager"
    channels:
      "👋・welcome": "👋・добро-пожаловать"
      "📜・rules": "📜・правила"
      "🚀・how-to-play": "🚀・как-играть"
      "🏛️・about": "🏛️・о-нас"
      "📢・announcements": "📢・анонсы"
      "💬・chat": "💬・чат"
  zh: { flag: "🇨🇳", name: "中文" }   # /announce only for now: no Chinese translations of info posts

roles:
  - name: Lead Moderator
    color: "#E74C3C"
    hoist: true
    mentionable: true
    permissions: &lead_perms
      - administrator   # granted by the owner 14.11
      - kick_members
      - ban_members
      - moderate_members
      - manage_messages
      - manage_threads
      - manage_nicknames
      - manage_roles
      - view_audit_log
      - mute_members
      - deafen_members
      - move_members
      - manage_events
  - name: Mod EN
    color: "#E67E22"
    hoist: true
    mentionable: true
    permissions: &mod_perms
      - kick_members
      - ban_members
      - moderate_members
      - manage_messages
      - manage_threads
      - manage_nicknames
      - view_audit_log
      - mute_members
      - deafen_members
      - move_members
      - manage_events
  - name: Mod RU
    color: "#E67E22"
    hoist: true
    mentionable: true
    permissions: *mod_perms
  # Language community manager: no server-wide permissions; all power is in their language category (perms there)
  - name: RU Community Manager
    color: "#F1C40F"
    hoist: true
    mentionable: true
    permissions: []
  - name: Helper
    color: "#1ABC9C"
    hoist: true
    mentionable: true
    permissions: []
  - name: "💜 Supporter"   # supported the project (Patreon/Boosty); granted by the Patreon integration (tiers $3/$10/$25) or by the team; gives /supporter show. The Patreon bot role goes right ABOVE this one, below Helper (16.11)
    color: "#8E44AD"
    hoist: true   # show as a separate group — enabled by the owner on production (17.11)
    permissions: []
  - name: "🎬 Creator"
    color: "#9B59B6"
    hoist: true
    permissions: []
  - name: "🧪 Tester"
    was: ["Тестировщик"]
    color: "#F39C12"
    permissions: []
  - name: EN   # unlocks the ENGLISH category; granted by onboarding (English option) or "Channels & Roles"
    permissions: []
  - name: RU
    permissions: []
  # classes — same as on the site; granted by onboarding, used for group finding and the profile badge
  - { name: Fighter, permissions: [] }
  - { name: Rogue, permissions: [] }
  - { name: Priest, permissions: [] }
  - { name: Pyromancer, permissions: [] }
  - { name: Swordmaster, permissions: [] }
  - { name: Druid, permissions: [] }
  - { name: Death Knight, permissions: [] }
  - { name: Cryomancer, permissions: [] }
  # ping subscriptions instead of @everyone
  - name: "🔔 Patch notes"
    mentionable: true
    permissions: []
  - name: "🔔 Events"
    was: ["Events"]
    mentionable: true
    permissions: []
  - name: "🔔 Streams"
    mentionable: true
    permissions: []

# Decisions of 14.11: Player and Whitelist are no longer needed, Developer goes away together with the framework, delete personal (named) roles.
# WARNING for production: before deleting Whitelist, check the backend's [auth] login_roles.
# EN is not deleted (15.11): needed again — it unlocks ENGLISH.
# Do NOT delete the GM role: the backend grants in-game GM by it ([auth.discord] roles → gm, 16.11).
# Delete only after gm in server.toml is reassigned to another role. "Main Developer" → admin, "Banned" → login ban — do not touch.
remove_roles: [Player, Developer, Whitelist]

staff:
  roles: [Lead Moderator, Mod EN, Mod RU]
  allow:
    - view_channel
    - send_messages
    - send_messages_in_threads
    - create_public_threads
    - manage_messages
    - manage_threads
    - mention_everyone
    - connect
    - speak

presets:
  # divider channel: no posting, no reactions (together with read_only)
  divider:
    "@everyone":
      deny: [add_reactions]
  read_only:
    "@everyone":
      deny: [send_messages, send_messages_in_threads, create_public_threads, create_private_threads]
  # no posting in the channel itself; allowed in your own private ticket thread
  tickets:
    "@everyone":
      deny: [send_messages, create_public_threads, create_private_threads]
  # helpers manage forum threads: "Solved", duplicates, closing
  helpers:
    Helper: { allow: [manage_threads] }

categories:
  - name: "📌 START"
    was: ["📌 INFO | Инфа", "📌 INFO"]
    channels:
      - name: "👋・welcome"
        topic: "Start here: how to get into the game"
        presets: [read_only]
        message: welcome
      - name: "📜・rules"
        topic: "Server rules"
        presets: [read_only]
        message: rules
      - name: "🚀・how-to-play"
        topic: "Four steps to your first raid"
        presets: [read_only]
        message: how_to_play
      - name: "❓・faq"
        topic: "Common problems and fixes"
        presets: [read_only]
        message: faq
      - name: "🏛️・about"
        topic: "Who we are and what we stand for"
        presets: [read_only]
        message: [about, mission]

  - name: "📢 NEWS"
    was: ["📢 | NEWS"]
    channels:
      - name: "📢・announcements"
        type: announcement
        topic: "Project news. Russian translation is in the thread under each post."
        presets: [read_only]
      - name: "🛠️・patch-notes"
        was: ["🛠・patch-notes", "🚀・game-updates"]
        type: announcement
        topic: "Server changelogs — same as on the site and in the launcher"
        presets: [read_only]
      - name: "🌐・server-status"
        topic: "Server status, online, season · server funding"
        presets: [read_only]

  - name: "ENGLISH"   # like РУССКИЙ: visible only with the EN role (English option in onboarding) — so Discord does not "recommend" it to everyone else
    was: ["💬 --- COMMUNITY ---", "💬 COMMUNITY", "💬 ENGLISH", "💬 Общение | COMMUNITY"]
    perms:
      "@everyone": { deny: [view_channel] }
      EN: { allow: [view_channel] }
    channels:
      - name: "💬・chat"
        was: ["💬・chat-en", "💬chat-eng"]   # 💬chat-eng — the live production chat: rename it, do not create a new one
        topic: "Talk about the game. Problems → support forum, memes → tavern"
        message: chat_en
      - name: "🍻・tavern"
        was: ["🍻・tavern-en"]
        topic: "Off-topic and memes, anything goes (rules still apply)"
        message: tavern_en
      - name: "🤝・lfg"
        was: ["🤝・lfg-en"]
        topic: "Looking for group: size, map, difficulty, time"
        slowmode: 30
        message: lfg_en
      - name: "🍺・Tavern"
        type: voice

  - name: "РУССКИЙ"   # name chosen by the owner 14.11 (was "🌍 РУССКИЙ")
    was: ["💬 РУССКИЙ"]
    perms:
      "@everyone": { deny: [view_channel] }
      RU: { allow: [view_channel] }
      "RU Community Manager":
        allow: [view_channel, send_messages, manage_messages, manage_threads, mention_everyone, mute_members, deafen_members, move_members]
    channels:
      # Dividers "━━━━・…・━━━━" — empty channels just for looks: they separate info and chat inside the category
      - name: "━━━━・инфо・━━━━"
        topic: "Разделитель: ниже — информация от команды"
        presets: [read_only, divider]
      # Copies of the starter channels: texts are translations from messages, maintained by the bot (edit in this file, not by hand)
      - name: "👋・добро-пожаловать"
        topic: "С чего начать: как попасть в игру"
        presets: [read_only]
        message: welcome_ru
      - name: "📜・правила"
        topic: "Правила сервера (перевод; при расхождении действует английская версия)"
        presets: [read_only]
        message: rules_ru
      - name: "🚀・как-играть"
        topic: "Четыре шага до первого рейда"
        presets: [read_only]
        message: how_to_play_ru
      - name: "🏛️・о-нас"
        topic: "Кто мы и за что стоим"
        presets: [read_only]
        message: [about_ru, mission_ru]
      # Announcements in Russian: the bot posts a translation of every post from 📢・announcements here; the manager can post their own
      - name: "📢・анонсы"
        type: announcement
        topic: "Новости проекта на русском. Оригинал — по ссылке под каждым постом"
        presets: [read_only]
        perms:
          "RU Community Manager": { allow: [send_messages, create_public_threads, send_messages_in_threads] }
      - name: "━━━━・общение・━━━━"
        topic: "Разделитель: ниже — общение"
        presets: [read_only, divider]
      - name: "💬・чат"
        was: ["💬・chat-ru", "💬чат-русский"]   # 💬чат-русский — the live chat and system channel of production
        topic: "Разговоры про игру. Проблема → форум помощи, мемы → таверна"
        message: chat_ru
      - name: "🍻・таверна"
        was: ["🍻・tavern-ru"]
        topic: "Флудилка: оффтоп и мемы (правила действуют и тут)"
        message: tavern_ru
      - name: "🤝・поиск-группы"
        was: ["🤝・lfg-ru"]
        topic: "Поиск группы: размер, карта, сложность, время"
        slowmode: 30
        message: lfg_ru
      - name: "🍺・Таверна"
        type: voice

  - name: "🆘 HELP"
    was: ["🆘 | HELP"]
    channels:
      - name: "📚・guides"
        type: forum
        message: guides_example
        topic: |
          Guides and builds. Add a class tag, a map tag if it is about a map, and a language tag.
        require_tag: true
        sort: activity
        default_reaction: "👍"
        tags:
          - { name: "Fighter", emoji: "🛡" }
          - { name: "Rogue", emoji: "🗡" }
          - { name: "Priest", emoji: "✨" }
          - { name: "Pyromancer", emoji: "🔥" }
          - { name: "Swordmaster", emoji: "⚔" }
          - { name: "Druid", emoji: "🌿" }
          - { name: "Death Knight", emoji: "💀" }
          - { name: "Cryomancer", emoji: "❄" }
          - { name: "Sinner's End", emoji: "🕳" }
          - { name: "Clouseau Castle", emoji: "🏰" }
          - { name: "PvP", emoji: "🤺" }
          - { name: "Beginner", emoji: "🌱" }
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
      - name: "💰・trade"
        type: forum
        topic: |
          Buy, sell and trade in-game items. Add a type, rarity, class and language tag. In-game gold only: real money = ban.
        require_tag: true
        sort: creation
        slowmode: 1800
        auto_archive: 4320
        tags:
          - { name: "WTB", emoji: "🛒" }
          - { name: "WTS", emoji: "💰" }
          - { name: "WTT", emoji: "🔄" }
          - { name: "Price check", emoji: "❓" }
          - { name: "Done", emoji: "✅" }
          - { name: "Epic", emoji: "🟣" }
          - { name: "Legendary", emoji: "🟠" }
          - { name: "Unique", emoji: "🟡" }
          - { name: "Fighter", emoji: "🛡" }
          - { name: "Rogue", emoji: "🗡" }
          - { name: "Priest", emoji: "✨" }
          - { name: "Pyromancer", emoji: "🔥" }
          - { name: "Swordmaster", emoji: "⚔" }
          - { name: "Druid", emoji: "🌿" }
          - { name: "Death Knight", emoji: "💀" }
          - { name: "Cryomancer", emoji: "❄" }
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
      - name: "🆘・support"
        was: ["🆘・supports", "🆘・help", "🆘・player-support"]
        type: forum
        presets: [helpers]
        message: support_example
        topic: |
          One problem — one post. Check {#❓・faq} first. Add a language tag and a topic tag.
          Never post your password or payment details; for private matters open a ticket in {#🎫・tickets}.
        require_tag: true
        tags:
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
          - { name: "Install", emoji: "📦" }
          - { name: "Launcher", emoji: "🐉" }
          - { name: "Connection", emoji: "📡" }
          - { name: "In game", emoji: "🎮" }
          - { name: "Account", emoji: "👤" }
          - { name: "Solved", emoji: "✅" }
      - name: "🎫・tickets"
        topic: "Private help from moderators: account, ban, reports"
        presets: [tickets]

  # Chat lives in the language categories, each visible only with its own role (EN, RU); onboarding grants the roles.
  - name: "📣 FEEDBACK"
    channels:
      - name: "🐛・bug-reports"
        type: forum
        presets: [helpers]
        message: bug_example
        topic: |
          One bug — one post. Include the battle number from the ping line, steps, expected/actual, relay.log and launcher.log.
        require_tag: true
        tags:
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
          - { name: "Crash", emoji: "💥" }
          - { name: "Gameplay", emoji: "🎮" }
          - { name: "Launcher", emoji: "🐉" }
          - { name: "Critical", emoji: "🔥", moderated: true }
          - { name: "In progress", emoji: "🛠", moderated: true }
          - { name: "Fixed", emoji: "✅", moderated: true }
          - { name: "Not a bug", emoji: "🚫", moderated: true }
      - name: "💡・ideas"
        type: forum
        presets: [helpers]
        message: ideas_example
        topic: |
          One idea per post. Add a language tag and a category. Vote with 👍. Status tags are set by the team.
        require_tag: true
        default_reaction: "👍"
        sort: activity
        tags:
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
          - { name: "Gameplay", emoji: "🎮" }
          - { name: "Balance", emoji: "📊" }
          - { name: "Content", emoji: "🗺" }
          - { name: "Accepted", emoji: "✅", moderated: true }
          - { name: "Planned", emoji: "🛠", moderated: true }
          - { name: "Rejected", emoji: "❌", moderated: true }
      - name: "⚖️・balance"
        was: ["⚖️・balance-showcase"]
        type: forum
        presets: [helpers]
        message: balance_example
        topic: |
          Balance proposals: what is off, why, what to change. One topic per post.
        require_tag: true
        default_reaction: "👍"
        tags:
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
          - { name: "Classes", emoji: "⚔" }
          - { name: "Items", emoji: "💎" }
          - { name: "Maps", emoji: "🗺" }
          - { name: "PvP", emoji: "🤺" }
          - { name: "Accepted", emoji: "✅", moderated: true }
          - { name: "Rejected", emoji: "❌", moderated: true }

  - name: "🎥 MEDIA"
    was: ["🎉 EVENTS & CREATORS", "🎬 CREATORS | Контент"]
    channels:
      - name: "🖼️・media"
        was: ["🖼・media"]
        topic: "Screenshots and GIFs from the game. Images only — the bot removes anything else. Videos and clips → 📺・content; talk about a picture in its thread"
      - name: "🎙・Dev Talks"
        type: stage
      - name: "📺・content"
        type: forum
        message: content_example
        topic: |
          Videos, clips, streams, guides, shorts and art about the game. One post — one piece of content. Type tag + language tag.
        require_tag: true
        layout: gallery
        sort: creation
        slowmode: 21600
        default_reaction: "🔥"
        tags:
          - { name: "Video", emoji: "🎥" }
          - { name: "Clip", emoji: "🎞️" }
          - { name: "Stream", emoji: "🔴" }
          - { name: "Guide", emoji: "📚" }
          - { name: "Shorts", emoji: "🩳" }
          - { name: "Art", emoji: "🎨" }
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
      - name: "🔴・live-now"
        topic: "Our creators' streams and new videos. Pings: 🔔 Streams"
        presets: [read_only]
      - name: "🎬・creator-hub"
        message: creator_hub
        topic: "Creators × team: early news under embargo, keys, collabs"
        perms:
          "@everyone": { deny: [view_channel] }
          "🎬 Creator": { allow: [view_channel] }
      - name: "📦・press-kit"
        message: press_kit
        topic: "Logos, screenshots, trailers, brand rules"
        presets: [read_only]
        perms:
          "@everyone": { deny: [view_channel] }
          "🎬 Creator": { allow: [view_channel] }

  - name: "🔊 VOICE"
    channels:
      - name: "➕・Duo"
        was: ["➕・Create room"]
        type: voice
      - name: "➕・Trio"
        type: voice

  - name: "🧪 PLAYTEST"
    perms:
      "@everyone": { deny: [view_channel] }
      "🧪 Tester": { allow: [view_channel] }
    channels:
      - name: "📣・test-announcements"
        topic: "What we test, build, dates, how to connect"
        presets: [read_only]
        message: playtest
      - name: "🐞・test-bugs"
        type: forum
        topic: |
          Test server bugs and feedback. Same template as the main bug forum. What is tested stays here until release.
        require_tag: true
        tags:
          - { name: "Crash", emoji: "💥" }
          - { name: "Gameplay", emoji: "🎮" }
          - { name: "Balance", emoji: "📊" }
          - { name: "Launcher", emoji: "🐉" }
          - { name: "Feedback", emoji: "💬" }
          - { name: "EN", emoji: "🇬🇧" }
          - { name: "RU", emoji: "🇷🇺" }
      - name: "💬・test-chat"
        topic: "Playtest discussion, any language"
      - name: "🔊・Test squad"
        type: voice

  - name: "🛡️ TEAM"
    was: ["🛡 TEAM", "🛡 STAFF"]
    perms:
      "@everyone": { deny: [view_channel] }
    channels:
      - name: "🛡️・mod-chat"
        was: ["🛡・mod-chat"]
      - name: "📋・mod-log"
      - name: "🛟・helpers"
        message: helpers
        topic: "Helpers × moderators"
        perms:
          Helper: { allow: [view_channel] }
      - name: "📘・handbook"
        type: forum
        topic: "Team handbook: one post per topic. Helpers read and discuss; moderators create posts."
        sort: creation
        # posts are created in order, newest on top — so the list is reversed; "Start here" is pinned
        message: [hb_todo, hb_prompts_support, hb_prompts_posts, hb_config, hb_bot, hb_publish, hb_helpers, hb_mod, hb_lang, hb_roles, hb_map, hb_start, hb_prompt_base, hb_style, hb_agent, hb_announce_flow]
        perms:
          Helper:
            allow: [view_channel, read_message_history, send_messages_in_threads]
            deny: [send_messages, create_public_threads]
        tags:
          - { name: "Start here", emoji: "📌" }
          - { name: "Guide", emoji: "🗺️" }
          - { name: "Rules", emoji: "📏" }
          - { name: "Moderation", emoji: "🛡️" }
          - { name: "Helpers", emoji: "🛟" }
          - { name: "Bot", emoji: "🤖" }
          - { name: "Config", emoji: "⚙️" }
          - { name: "AI prompts", emoji: "✨" }
          - { name: "To do", emoji: "🧾" }

  - name: "🗄️ ARCHIVE"
    was: ["🗄 ARCHIVE"]
    perms:
      "@everyone": { deny: [view_channel] }
    channels: []

# Channels moved to the archive: visible to the team only, read-only. Names from another server are simply skipped.
archive:
  category: "🗄️ ARCHIVE"
  channels:
    - "🤖・bot-commands"
    - "⭐・starboard"
    - "🔊・Lounge EN"
    - "🔊・Lounge RU"
    - "📚・docs-and-faq"
    - "💻・dev-chat-en"
    - "💻・dev-chat-ru"
    - "❓・framework-help"
    - "✨・plugin-showcase"
    - "📦・framework-releases"
    - "🐉launcher"
    - "mod-мод"
    - "server-hub"
