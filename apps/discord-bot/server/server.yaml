  faq:
    translations: { ru: faq_ru }
    content: |
      # ❓ FAQ
      ### Is it free?
      Yes. No paid access, no pay-to-win. Donations pay the servers first, then a server reserve, then thank the team. Nothing in the game.
      ### Is this an official server?
      No. It's a fan project run by the community, not affiliated with the developers or the publisher.
      ### What do I need to play?
      Windows 10/11, Dungeonborne installed and a Discord account on this server. Four steps → {#🚀・how-to-play}
      ### No Dungeonborne in your Steam library?
      **Had it before?** It's still in your Steam library: install it from there.
      **Never had it?** Steam no longer gives it out: <https://drive.google.com/file/d/1_4sjvKpvc6LS3X2aZW5Z9QXvKKRPjevF/view?usp=sharing>.
      Then point the launcher to the game folder.
      ### Why do I log in with Discord?
      Your game account is your Discord account. Leave this server and login stops working.
      ### Will my progress be reset?
      It's a playtest: the database may be reset. Resets are announced in {#📢・announcements}.
      ### Where do I get the framework?
      On GitHub: <https://github.com/dungeonborne-community/dungeonborne>. It's closed until the core is finished; we'll announce the opening.
      ### Can I run my own server?
      Once the framework opens, yes: your own rules, your own balance.
      ### How do I find a party?
      Post in {#🤝・lfg} or join {#➕・Duo} / {#➕・Trio}: the bot opens a voice room for you.
      ### Found a bug or have an idea?
      {#🐛・bug-reports} with the battle number · {#💡・ideas} · {#⚖️・balance}
      ### How can I help?
      Write guides in {#📚・guides}, make videos, help newcomers. Want to be a Helper? Open a ticket in {#🎫・tickets}.

      **Something not working?** See [Help on the site](https://www.dungeonborne-community.com/#help) or ask in {#🆘・support}.
  faq_ru:
    content: |
      # ❓ Частые вопросы
      ### Это бесплатно?
      Да. Никакого платного доступа и pay-to-win. Пожертвования сначала оплачивают серверы, сверх этого — резерв серверов, дальше — благодарность команде. В игре они ничего не дают.
      ### Это официальный сервер?
      Нет. Это фан-проект сообщества, он не связан с разработчиками и издателем игры.
      ### Что нужно, чтобы играть?
      Windows 10/11, установленная Dungeonborne и аккаунт Discord на этом сервере. Четыре шага → {#🚀・how-to-play}
      ### Нет игры в Steam?
      **Была раньше?** Она осталась в твоей библиотеке Steam — установи оттуда.
      **Не было?** Steam её больше не выдаёт: <https://drive.google.com/file/d/1_4sjvKpvc6LS3X2aZW5Z9QXvKKRPjevF/view?usp=sharing>.
      Потом укажи папку игры в лаунчере.
      ### Зачем входить через Discord?
      Аккаунт в игре — это твой Discord. Выйдешь с сервера — вход перестанет работать.
      ### Прогресс сбросят?
      Идёт плейтест: базу могут сбрасывать. О сбросах пишем в {#📢・announcements}.
      ### Где взять фреймворк?
      На GitHub: <https://github.com/dungeonborne-community/dungeonborne>. Репозиторий закрыт, пока не готово ядро; когда откроется — напишем в {#📢・announcements}.
      ### Можно поднять свой сервер?
      Да, когда откроется фреймворк: он для этого и нужен. Свои правила, свой баланс.
      ### Как найти группу?
      Напиши в {#🤝・поиск-группы} или зайди в {#➕・Duo} / {#➕・Trio}: бот откроет голосовую комнату.
      ### Нашёл баг или есть идея?
      {#🐛・bug-reports} с номером боя · {#💡・ideas} · {#⚖️・balance} — пиши на русском, ставь тег RU
      ### Как помочь?
      Пиши гайды в {#📚・guides}, снимай видео, помогай новичкам. Хочешь стать хелпером? Открой тикет в {#🎫・tickets}.

      **Что-то не работает?** Загляни в [«Помощь» на сайте](https://www.dungeonborne-community.com/?lang=ru#help) или спроси в {#🆘・support} (тег RU).

  # Chat hints — in the channel's language, no translations
  chat_en:
    pin: true
    content: |
      ## 💬 Chat
      Talk about the game: raids, classes, the season. English here, please — other languages have their own categories. Be nice 🙂
      - Problem → {#🆘・support} · Bug → {#🐛・bug-reports} · Idea → {#💡・ideas}
      - Off-topic and memes → {#🍻・tavern} · Looking for a group → {#🤝・lfg}
  chat_ru:
    pin: true
    content: |
      ## 💬 Русский чат
      Разговоры про игру: рейды, классы, сезон. Будь вежлив 🙂
      - Проблема → {#🆘・support} · Баг → {#🐛・bug-reports} · Идея → {#💡・ideas} — с тегом RU
      - Оффтоп и мемы → {#🍻・таверна} · Поиск группы → {#🤝・поиск-группы}
  tavern_en:
    pin: true
    content: |
      ## 🍻 Tavern
      Off-topic, memes, anything that isn't about the game.
      -# The rules still apply: no politics, no NSFW.
  tavern_ru:
    pin: true
    content: |
      ## 🍻 Таверна
      Оффтоп, мемы, всё, что не про игру.
      -# Правила действуют и тут: без политики и NSFW.
  lfg_en:
    pin: true
    content: |
      ## 🤝 How to find a group
      Copy, fill in, post. Reply in the thread under the post.
      ```
      Size:  duo / trio
      Map:   Sinner's End / Clouseau Castle
      Mode:  Normal / Classic / Hard
      Class: Priest
      When:  today 21:00 CET · Voice: yes
      ```
      -# Found your party? Join {#➕・Duo} or {#➕・Trio} — the bot opens a room for you.
  lfg_ru:
    pin: true
    content: |
      ## 🤝 Как найти группу
      Скопируй, заполни, отправь. Отвечай в ветке под постом.
      ```
      Размер:  дуо / трио
      Карта:   Кончина грешника / Замок Клузо
      Режим:   обычный / Classic / Hard
      Класс:   жрец
      Когда:   сегодня 21:00 МСК · Голос: да
      ```
      -# Собрал пати? Заходи в {#➕・Duo} или {#➕・Trio} — бот откроет комнату.

  # Sample posts in forums: instructions as plain text, the example itself as a card (embed), the instruction translation as the next message
  support_example:
    pin: true
    title: "📌 How to get help — example"
    tags: [EN, Connection, Solved]
    translations: { ru: support_example_ru }
    content: |
      **One problem — one post.** Any language — add its tag, plus a topic tag.
      ⚠️ Never post your password or payment details; for private matters open a ticket in {#🎫・tickets}.

      Example 👇
    embeds:
      - title: "Example: can't connect, \"CURLCode 28\""
        color: "#E67E22"
        description: |
          **What happens:** the launcher shows CURLCode 28 when logging in
          **Since when:** today, about 18:00 CET
          **What I tried:** restarted the launcher and the router
          **Logs:** relay.log and launcher.log attached

          **✅ Solution:** Cloudflare WARP on, launcher restarted. The author adds ✅ Solved.
  support_example_ru:
    content: |
      🇷🇺 **Одна проблема — один пост.** Пиши на русском, поставь тег RU и тег темы.
      ⚠️ Никогда не пиши пароль и платёжные данные; приватное — через тикет в {#🎫・tickets}.
  guides_example:
    pin: true
    title: "📌 How to post a guide — example"
    tags: [Priest, Beginner, EN]
    translations: { ru: guides_example_ru }
    content: |
      **One guide or build per post.** Add a class tag, a map tag if it is about a map, and a language tag.

      Example 👇
    embeds:
      - title: "Example: Priest for beginners — staying alive in trio"
        color: "#E0A84A"
        description: |
          **Gear:** what to take and what is not worth the risk
          **Skills and talents:** which ones and why
          **In the raid:** where to stand, when to heal, when to leave through the blue portal
          **Video or screenshots:** attached
  guides_example_ru:
    content: |
      🇷🇺 **Один гайд или билд — один пост.** Тег класса, карты (если про карту) и языка — RU.
  bug_example:
    pin: true
    title: "📌 How to report a bug — example"
    tags: [EN, In progress]
    translations: { ru: bug_example_ru }
    content: |
      **One bug — one post.** Add a language tag. The team sets the status tag.

      Example 👇
    embeds:
      - title: "Example: inventory is not saved after the raid"
        color: "#ED4245"
        description: |
          **Battle number** (from the ping line): 48213
          **Steps:** ① pick up an item ② exit through the blue portal ③ open the stash
          **Expected:** the item is in the stash · **Actual:** it is gone
          **Logs:** relay.log, launcher.log
  bug_example_ru:
    content: |
      🇷🇺 **Один баг — один пост.** Тег RU; статус ставит команда. Номер боя из строки пинга, шаги, ожидалось/получилось, relay.log и launcher.log.
  ideas_example:
    pin: true
    title: "📌 How to suggest an idea — example"
    tags: [EN, Gameplay]
    translations: { ru: ideas_example_ru }
    content: |
      **One idea — one post.** Add a language tag and a category. Vote for ideas you like with 👍.

      Example 👇
    embeds:
      - title: "Example: weekly dungeon leaderboard"
        color: "#F1C40F"
        description: |
          **Idea:** a weekly leaderboard for the fastest dungeon clears.
          **Why:** gives experienced players a goal and a reason to come back every week.
          **How:** top 10 groups get a cosmetic title; the board resets every Monday.
  ideas_example_ru:
    content: |
      🇷🇺 **Одна идея — один пост.** Тег RU и тег категории. Голосуй за понравившиеся 👍.
  balance_example:
    pin: true
    title: "📌 How to propose a balance change — example"
    tags: [EN, Classes]
    translations: { ru: balance_example_ru }
    content: |
      **One topic per post.** Say what is off, why you think so, and what exactly to change.

      Example 👇
    embeds:
      - title: "Example: Cryomancer slow lasts too long in trio PvP"
        color: "#3498DB"
        description: |
          **What is off:** the slow lasts 4 s and stacks with two Cryomancers
          **Why:** a trio with two Cryomancers locks melee classes for the whole fight
          **Proposal:** 3 s, does not stack from different Cryomancers
  balance_example_ru:
    content: |
      🇷🇺 **Одна тема — один пост.** Тег RU. Что не так, почему ты так считаешь и что именно изменить.
  content_example:
    pin: true
    title: "📌 How to share your content — example"
    tags: [Video, EN]
    translations: { ru: content_example_ru }
    content: |
      **One post — one video, clip, stream or guide.** Type tag + language tag. One new post per 6 hours.
      Make content regularly? Apply via {#🎫・tickets} — creators announce their streams and videos in {#🔴・live-now}.

      Example 👇
    embeds:
      - title: "Example: Solo dungeon run — full guide for beginners"
        color: "#E91E63"
        description: |
          **What:** a 15-minute guide: route, loot, boss tips
          **Link:** https://youtube.com/… (Discord shows the preview by itself)
          **Language:** EN, RU subtitles
  content_example_ru:
    content: |
      🇷🇺 **Один пост — одно видео, клип, стрим или гайд.** Тег типа и RU. Новый пост — раз в 6 часов.
      Регулярно делаешь контент? Заявка через {#🎫・tickets} — авторы анонсируют стримы и видео в {#🔴・live-now}.

  creator_hub:
    pin: true
    translations: { ru: creator_hub_ru }
    content: |
      ## 🎬 Creator hub
      - Going live or posted a video? Use the buttons on the panel below — the announcement goes to {#🔴・live-now}.
      - News may appear here **before** release. It stays under embargo until the official post in {#📢・announcements}.
      - Materials for your videos: {#📦・press-kit}.
  creator_hub_ru:
    content: |
      ## 🎬 Для авторов
      - Начал стрим или выложил видео? Кнопки на панели ниже — анонс уйдёт в {#🔴・live-now}.
      - Новости могут появляться здесь **до** релиза. Они под эмбарго до официального поста в {#📢・announcements}.
      - Материалы для роликов: {#📦・press-kit}.
  press_kit:
    content: |
      ## 📦 Press kit
      - 🖼 Logos: TODO
      - 🎞 Trailer: TODO
      - 📸 Screenshots: TODO
      - 📋 Brand rules: TODO
  playtest:
    translations: { ru: playtest_ru }
    content: |
      # 🧪 Playtest
      Closed tests run on a separate game server: add it in the launcher with **Add server**. The address and the build are in each test announcement here.
      - **Embargo:** what we test stays in this category until release. Leaks → the role is removed.
      - **Rotation:** two tests without taking part → the role is removed, so the group stays active.
      - **Bugs** → {#🐞・test-bugs} with the battle number and logs.
  playtest_ru:
    content: |
      # 🧪 Плейтест
      Закрытые тесты идут на отдельном сервере игры: добавь его в лаунчере кнопкой **«Добавить сервер»**. Адрес и сборка — в анонсе каждого теста здесь.
      - **Эмбарго:** всё, что тестируем, остаётся в этой категории до релиза. Слив → роль снимается.
      - **Ротация:** два теста без участия → роль снимается, чтобы группа оставалась живой.
      - **Баги** → {#🐞・test-bugs} с номером боя и логами.
  helpers:
    pin: true
    translations: { ru: helpers_ru }
    content: |
      ## 🛟 Helpers
      - **You do:** answer in {#🆘・support}, add ✅ Solved when the author confirms, move chat questions to the forum, mark duplicate bugs, ask for the battle number and logs.
      - **You don't:** bans, timeouts, deleting other people's messages — call {@Mod EN} / {@Mod RU}.
      - **Tone:** short, friendly, one step at a time. Not sure? Ask here first.
  helpers_ru:
    content: |
      ## 🛟 Хелперы
      - **Ты делаешь:** отвечаешь в {#🆘・support}, ставишь ✅ Solved, когда автор подтвердил, переносишь вопросы из чатов в форум, помечаешь дубли багов, просишь номер боя и логи.
      - **Ты не делаешь:** баны, тайм-ауты, удаление чужих сообщений — зови {@Mod EN} / {@Mod RU}.
      - **Тон:** коротко, дружелюбно, по шагу за раз. Не уверен — сначала спроси здесь.

  # ── 📘・handbook: team forum. Post = topic; English is the post, Russian is the next message in it.
  hb_start:
    pin: true
    title: "📌 Start here: how this forum works"
    tags: [Start here]
    translations: { ru: hb_start_ru }
    content: |
      # 📘 Team handbook
      Everything the team needs to run Dungeonborne Community: one post per topic, find them by tag.
      Helpers can read and discuss in posts; new posts are made by moderators.

      ## Golden rules
      1. **The config is the source of truth.** Channels, permissions and info texts live in `server.yaml`; manual edits in Discord get rolled back.
      2. **Test first.** Every change goes to the test server first, then plan → owner's OK → production.
      3. **One ping per post**, a subscription role. `@everyone` only for a wipe, a long outage or a security threat.
      4. **AI drafts, people publish.** See "Publishing" and "AI prompts".
      5. **Private stays private**: logs, nicknames, openid, tickets and playtest news don't go to open channels.

      Topics: Server map · Roles · Languages · Moderation · Helpers · Publishing · Writing style · Bot · Config · AI prompts · To do
  hb_start_ru:
    content: |
      # 📘 Handbook команды
      Всё, что нужно команде, чтобы вести Dungeonborne Community: по посту на тему, ищи по тегам.
      Хелперы читают и обсуждают в постах; новые посты создают модераторы.

      ## Главные правила
      1. **Конфиг — источник правды.** Каналы, права и тексты инфо-каналов — в `server.yaml`; ручные правки в Discord откатятся.
      2. **Сначала тест.** Любое изменение — на тестовом сервере, потом план → «да» владельца → боевой.
      3. **Один пинг на пост**, роль-подписка. `@everyone` — только вайп, долгое падение или угроза безопасности.
      4. **ИИ пишет черновик, публикует человек.** См. «Publishing» и «AI prompts».
      5. **Приватное остаётся приватным**: логи, ники, openid, тикеты и новости плейтеста — не в открытые каналы.

  hb_map:
    title: "🗺️ Server map"
    tags: [Guide]
    translations: { ru: hb_map_ru }
    content: |
      Newcomer path: onboarding → rules screening → {#👋・welcome} → {#🚀・how-to-play} → the game.

      - **📌 START** — welcome, rules, how-to-play, faq, about · everyone
      - **📢 NEWS** — announcements, patch-notes, server-status · everyone reads, the team writes
      - **🆘 HELP** — guides forum, support forum, tickets · everyone
      - **ENGLISH** — chat, tavern, lfg, Tavern voice · EN role (onboarding: English)
      - **РУССКИЙ** — чат, таверна, поиск-группы, voice · RU role
      - **📣 FEEDBACK** — bug-reports, ideas, balance forums · everyone, language tag
      - **🎥 MEDIA** — media (images and GIFs only), content forum, live-now, Dev Talks · everyone; creator-hub and press-kit · 🎬 Creator
      - **🔊 VOICE** — ➕ Duo, ➕ Trio: join and the bot opens a room for 2 or 3
      - **🧪 PLAYTEST** — closed tests under embargo · 🧪 Tester
      - **🛡️ TEAM** — mod-chat, mod-log, helpers, this handbook · team (+ Helper where noted)
      - **🗄️ ARCHIVE** — old channels, read-only · team
  hb_map_ru:
    content: |
      Путь новичка: адаптация → правила при входе → {#👋・welcome} → {#🚀・how-to-play} → игра.

      - **📌 START** — welcome, rules, how-to-play, faq, about · все
      - **📢 NEWS** — announcements, patch-notes, server-status · читают все, пишет команда
      - **🆘 HELP** — форум guides, форум support, tickets · все
      - **ENGLISH** — chat, tavern, lfg, войс Tavern · роль EN (адаптация: English)
      - **РУССКИЙ** — чат, таверна, поиск-группы, войс · роль RU
      - **📣 FEEDBACK** — форумы bug-reports, ideas, balance · все, тег языка
      - **🎥 MEDIA** — media (только картинки и GIF), форум content, live-now, Dev Talks · все; creator-hub и press-kit · 🎬 Creator
      - **🔊 VOICE** — ➕ Duo, ➕ Trio: зашёл — бот создал комнату на 2 или 3
      - **🧪 PLAYTEST** — закрытые тесты под эмбарго · 🧪 Tester
      - **🛡️ TEAM** — mod-chat, mod-log, helpers, этот handbook · команда (+ Helper, где указано)
      - **🗄️ ARCHIVE** — старые каналы, только чтение · команда

  hb_roles:
    title: "🎭 Roles"
    tags: [Guide]
    translations: { ru: hb_roles_ru }
    content: |
      **Team** (given by the owner)
      - **Lead Moderator** — administrator: everything on the server
      - **Mod EN, Mod RU** — ban, kick, timeout, delete, threads, voice, events, `/announce`
      - **RU Community Manager** — runs the РУССКИЙ category: delete and pin messages, threads, mute and move in voice, own news in 📢・анонсы. No powers outside the category. The bot-kept copies (welcome, rules, how-to-play, about) are changed in `server.yaml` only
      - **Helper** — forum threads (Solved, duplicates), Move to support, `/faq` in channel, {#🛟・helpers}

      **Status** (on request)
      - **🎬 Creator** — creator application in {#🎫・tickets} → `/creator add`
      - **🧪 Tester** — given by the team; two tests without taking part → removed

      **Self-chosen** (onboarding or Channels & Roles)
      - **EN** — opens the ENGLISH category
      - **RU** — opens the РУССКИЙ category
      - **8 classes** — Fighter, Rogue, Priest, Pyromancer, Swordmaster, Druid, Death Knight, Cryomancer
      - **🔔 Patch notes, 🔔 Events, 🔔 Streams** — subscriptions instead of `@everyone`

      New roles are added in `server.yaml` first. On production never delete **Banned**: the backend uses it to block game login.
  hb_roles_ru:
    content: |
      **Команда** (выдаёт владелец)
      - **Lead Moderator** — администратор: всё на сервере
      - **Mod EN, Mod RU** — бан, кик, тайм-аут, удаление, ветки, войсы, ивенты, `/announce`
      - **RU Community Manager** — ведёт категорию РУССКИЙ: удаляет и закрепляет сообщения, ветки, мут и перенос в голосовых, свои новости в 📢・анонсы. Вне категории прав нет. Копии от бота (welcome, rules, how-to-play, about) правятся только в `server.yaml`
      - **Helper** — ветки форумов («Решено», дубли), Move to support, `/faq` в канал, {#🛟・helpers}

      **Статусы** (по заявке)
      - **🎬 Creator** — заявка автора в {#🎫・tickets} → `/creator add`
      - **🧪 Tester** — выдаёт команда; два теста без участия — роль снимается

      **Сами** (адаптация или «Каналы и роли»)
      - **EN** — открывает категорию ENGLISH
      - **RU** — открывает категорию РУССКИЙ
      - **8 классов** — Fighter, Rogue, Priest, Pyromancer, Swordmaster, Druid, Death Knight, Cryomancer
      - **🔔 Patch notes, 🔔 Events, 🔔 Streams** — подписки вместо `@everyone`

      Новые роли — сначала в `server.yaml`. На боевом сервере никогда не удалять **Banned**: по ней бэкенд не пускает в игру.

  hb_lang:
    title: "🌍 Languages and translations"
    tags: [Guide]
    translations: { ru: hb_lang_ru }
    content: |
      English is the server language; Russian is the first opt-in language, others are added the same way.
      - **Info posts** (welcome, rules, how-to-play, faq, about, news, patch notes) are in English. Under each: a 🌍 thread with translations, a link and a language button — the bot shows the translation only to whoever clicks.
      - **Chat**: ENGLISH for those who picked English (EN role), РУССКИЙ for those who picked Russian (RU role). Both are hidden without the role, so Discord doesn't push them as channel suggestions. In a language category, write in its language.
      - **Language category** (РУССКИЙ) is run by its **community manager** (RU Community Manager: messages, threads, voice there). It also holds bot-kept copies of welcome, rules, how-to-play, about — change them in `server.yaml`, not by hand. 📢・анонсы gets every post from 📢・announcements in Russian, no ping; deleting the original deletes the copy. The manager may post Russian-only news there.
      - **Polls** — a separate poll in each language channel, right under the post: English in 📢・announcements, Russian in 📢・анонсы. `/announce` doesn't make polls: post them by hand (+ → Create poll) and add up the results.
      - **Forums** (support, bugs, ideas, balance, guides) are shared: any language with a language tag.
      - **Any message**: right-click → Apps → Translate (DeepL, private).

      **Adding a language:** add it at the end of `languages` in `server.yaml` and `bot.toml` → add translations to info messages → optionally a category with copies, a manager role (`category`, `manager`, `channels` in `languages`), `mirror` in `[announce]` and an onboarding option → run the script.
  hb_lang_ru:
    content: |
      Общий язык — английский; русский — первый язык по выбору, остальные добавляются так же.
      - **Инфо-посты** (welcome, rules, how-to-play, faq, about, новости, патчноуты) — на английском. Под каждым: ветка 🌍 с переводами, ссылка и кнопка языка — бот показывает перевод только нажавшему.
      - **Общение**: ENGLISH — для выбравших English (роль EN), РУССКИЙ — для выбравших русский (роль RU). Без роли категорий не видно, поэтому Discord не подсовывает их в рекомендации каналов. В языковой категории пишем на её языке.
      - **Языковую категорию** (РУССКИЙ) ведёт **комьюнити-менеджер** языка (RU Community Manager: сообщения, ветки, голосовые — там). В ней же копии welcome, rules, how-to-play, about, которые держит бот: править их — в `server.yaml`, не руками. В 📢・анонсы бот кладёт каждый пост из 📢・announcements на русском, без пинга; удалили оригинал — удалится и копия. Менеджер может писать туда и свои новости только для русских.
      - **Опросы** — отдельный опрос в каждом языковом канале, сразу под постом: английский в 📢・announcements, русский в 📢・анонсы. `/announce` опросы не делает: их ставят руками (+ → Создать опрос), итог — сумма.
      - **Форумы** (support, баги, идеи, баланс, гайды) — общие: любой язык с тегом языка.
      - **Любое сообщение**: ПКМ → Приложения → Translate (DeepL, видит только нажавший).

      **Новый язык:** добавить в конец `languages` в `server.yaml` и `bot.toml` → дописать переводы инфо-сообщений → по желанию категория с копиями и роль менеджера (`category`, `manager`, `channels` в `languages`), `mirror` в `[announce]` и вариант в адаптации → запустить скрипт.

  hb_mod:
    title: "🛡️ Moderation"
    tags: [Moderation]
    translations: { ru: hb_mod_ru }
    content: |
      **AutoMod** (staff are not checked; every hit goes to {#📋・mod-log})
      - Mention spam — block, log, 10 min timeout
      - Spam — block, log
      - Slurs and sexual content — block, log
      - Scam: free Nitro, fake Steam/Discord, "free crypto/skins" — block, log, 1 h timeout
      - Executables and foreign invites — block, log
      - Impersonation in names (admin, moderator, support…) — can't talk until the nickname changes

      **{#📋・mod-log}**: deleted and edited messages, joins and leaves (with the invite used), bans, timeouts, AutoMod, ticket transcripts, Discord raid alerts.

      **Tickets**: button in {#🎫・tickets} → form → private thread with the right role (EN → Mod EN, RU → Mod RU, creator and helper applications → both). One open ticket per person; the author or a mod closes it with 🔒, the transcript goes to mod-log.

      **{#🖼️・media}**: the bot deletes anything that isn't an image or GIF and shows a hint for 10 s.

      **Warnings**: one calm line with the rule number; arguments go to a ticket. Exploits and player reports only via tickets. A Discord ban also blocks the game launcher.
  hb_mod_ru:
    content: |
      **AutoMod** (команду не проверяет; каждое срабатывание — в {#📋・mod-log})
      - Mention spam — блок, лог, тайм-аут 10 мин
      - Spam — блок, лог
      - Slurs and sexual content — блок, лог
      - Скам: free Nitro, поддельные Steam/Discord, «free crypto/скины» — блок, лог, тайм-аут 1 ч
      - Исполняемые файлы и чужие приглашения — блок, лог
      - Самозванцы в никах (admin, moderator, поддержка…) — не может писать, пока не сменит ник

      **{#📋・mod-log}**: удалённые и изменённые сообщения, входы и выходы (с приглашением), баны, тайм-ауты, AutoMod, расшифровки тикетов, оповещения Discord о рейдах.

      **Тикеты**: кнопка в {#🎫・tickets} → форма → приватная ветка с нужной ролью (EN → Mod EN, RU → Mod RU, заявки автора и хелпера → обе). Один открытый тикет на человека; закрывает автор или модератор кнопкой 🔒, расшифровка — в mod-log.

      **{#🖼️・media}**: бот удаляет всё, что не картинка и не GIF, и на 10 с показывает подсказку.

      **Предупреждения**: одна спокойная строка с номером правила; споры — в тикет. Эксплойты и жалобы на игроков — только тикетом. Бан в Discord закрывает и вход в игру.

  hb_helpers:
    title: "🛟 Helpers"
    tags: [Helpers]
    translations: { ru: hb_helpers_ru }
    content: |
      A helper answers questions and keeps the forums tidy so moderators can focus on violations. Punishments are not a helper's job.

      - **Move to support** — right-click a chat message → Apps → Move to support: the question becomes a post in {#🆘・support} with a quote and a language tag; the author gets a link.
      - **`/faq`** — `/faq topic:` + start of the question, `user:` to address someone; answers in the channel's language or `language:`.
      - **Tags** — ✅ Solved in support once the author confirms; bug and idea statuses are set by the team.
      - **Duplicates** — link the original post and close the thread.
      - **{#🛟・helpers}** — ask when unsure, call a moderator.

      A bug report always needs the battle number (from the ping line in game), steps, expected vs actual, `relay.log` and `launcher.log`. Tone: short, friendly, one step at a time.

      **Becoming a helper:** "Become a Helper" form in {#🎫・tickets} → moderators decide in the thread and give the role.
  hb_helpers_ru:
    content: |
      Хелпер отвечает на вопросы и держит порядок в форумах, чтобы модераторам оставались нарушения. Наказания — не его задача.

      - **Move to support** — ПКМ по сообщению в чате → Приложения → Move to support: вопрос становится постом в {#🆘・support} с цитатой и тегом языка; автор получает ссылку.
      - **`/faq`** — `/faq topic:` + начало вопроса, `user:` — кому ответить; язык — по каналу или `language:`.
      - **Теги** — ✅ Solved в support, когда автор подтвердил; статусы багов и идей ставит команда.
      - **Дубли** — ссылка на исходный пост и закрыть ветку.
      - **{#🛟・helpers}** — спросить, если не уверен, позвать модератора.

      В баг-репорте всегда нужны номер боя (строка пинга в игре), шаги, «ожидалось / получилось», `relay.log` и `launcher.log`. Тон: коротко, дружелюбно, по шагу за раз.

      **Как стать хелпером:** анкета «Become a Helper» в {#🎫・tickets} → модераторы решают в ветке и выдают роль.

  hb_publish:
    title: "📢 Publishing: who posts what"
    tags: [Rules]
    translations: { ru: hb_publish_ru }
    content: |
      **Moderators** — events, maintenance, reminders and test posts via `/announce` only, checked by a second person. No dates or features the developer hasn't confirmed; nothing from PLAYTEST or creator-hub before release. Info channel texts are not edited by hand — ask an admin.

      **Admins** — releases, wipes, plans, rule changes; `@everyone` only for a wipe, an outage over a day or a security threat. Patch notes only in `patch_notes.toml` with `[update.lang.en]`: the launcher, the site and Discord take them from there. Info texts in `server.yaml`, test server first. Approve AI drafts.

      **AI** — drafts only; a person publishes via `/announce` or an admin's explicit OK on that exact text. The bot posts by itself only from fixed sources (patch notes, status, creator announcements, player bug reports). No invented facts, no pings, no moderation, no logs or personal data. AI translations of info posts are checked by a native speaker.

      **Every post**: headline = what happened · time as `<t:UNIX:F>` · English + translation in the form · one subscription ping · up to ~1500 characters · fixes as an edit with `-# Upd: …`, never delete and repost · discussion → {#💬・chat}.
  hb_publish_ru:
    content: |
      **Модераторы** — ивенты, техработы, напоминания и посты тестов только через `/announce`, с вычиткой вторым человеком. Без дат и функций, которые не подтвердил разработчик; ничего из PLAYTEST и creator-hub до релиза. Тексты инфо-каналов руками не правим — просим администратора.

      **Администраторы** — релизы, вайпы, планы, изменения правил; `@everyone` — только вайп, падение дольше суток или угроза безопасности. Список изменений — только в `patch_notes.toml` с `[update.lang.en]`: лаунчер, сайт и Discord берут его оттуда. Инфо-тексты — в `server.yaml`, сначала тестовый сервер. Утверждают черновики ИИ.

      **ИИ** — только черновики; публикует человек через `/announce` или по явному «да» администратора на этот текст. Сам бот публикует только из заданных источников (патчноуты, статус, анонсы авторов, баг-репорты игроков). Без выдуманных фактов, пингов, модерации, логов и личных данных. ИИ-перевод инфо-постов вычитывает носитель языка.

      **Любой пост**: заголовок = что случилось · время меткой `<t:UNIX:F>` · английский + перевод в форме · один пинг подписки · до ~1500 символов · исправление — правкой с `-# Upd: …`, не удалять и не публиковать заново · обсуждение → {#💬・chat}.

  hb_bot:
    title: "🤖 Bot: commands and automation"
    tags: [Bot]
    translations: { ru: hb_bot_ru }
    content: |
      - `/announce` · moderators — form → preview → post with translation, ping and crossposting
      - `/faq` · everyone (in channel: helpers and mods) — answer with a FAQ section
      - **Move to support** (message menu) · helpers, mods — chat question → help forum post
      - **Translate** (message menu) · everyone — private DeepL translation
      - **Language buttons** under posts · everyone — human translation from the 🌍 thread, private
      - `/ticketpanel`, `/rolepanel`, `/creator panel` · admins — publish button panels
      - `/creator add · remove · list` · mods — 🎬 Creator role
      - `/giveaway start · end · reroll` · mods — giveaways
      - `/invites` · mods — who invited whom and who stayed
      - `/embed` · admins — a card message from the bot
      - **Delete later** (message menu) · mods — delete a message (and its thread) after 30m, 12h, 7d
      - `/event create · close · list` · mods — event + temporary category from a template; archives itself
      - `/poll` · mods — native Discord poll: question, answers one per line, hours, multiselect
      - `/slowmode seconds [for]` · mods — slow mode; with `for` (30m, 2h) it reverts itself
      - `/emojimode on · off [user] [for]` · mods — emoji-only channel, or one `user` everywhere
      - `/fund add·goal·close·thank` · admins — funding sums, goals · `/supporter show·hide` · 💜 Supporter — thank-you list
      - `/room lock · unlock · limit · name · kick · owner` · room owner, mods — manage your Duo/Trio room

      **Automation**: greeting after the rules in {#💬・chat} (and {#💬・чат} for RU) · Duo/Trio voice rooms · patch notes and server status · funding bar in 🌐・server-status · media filter · mod-log · invite tracker · bug reports from the launcher and the game (enabled once the backend is deployed).

      The bot runs on the same VM as the backend. Only one bot process per database: a second one won't start.
  hb_bot_ru:
    content: |
      - `/announce` · модераторы — форма → предпросмотр → пост с переводом, пингом и рассылкой
      - `/faq` · все (в канал — хелперы и модераторы) — ответ разделом FAQ
      - **Move to support** (меню сообщения) · хелперы, модераторы — вопрос из чата → пост в help
      - **Translate** (меню сообщения) · все — перевод DeepL только для себя
      - **Кнопки языков** под постами · все — человеческий перевод из ветки 🌍, только для себя
      - `/ticketpanel`, `/rolepanel`, `/creator panel` · админы — опубликовать панели с кнопками
      - `/creator add · remove · list` · модераторы — роль 🎬 Creator
      - `/giveaway start · end · reroll` · модераторы — розыгрыши
      - `/invites` · модераторы — кто кого привёл и кто остался
      - `/embed` · админы — карточка от имени бота
      - **Delete later** (меню сообщения) · модераторы — удалить сообщение (и его ветку) через 30m, 12h, 7d
      - `/event create · close · list` · модераторы — мероприятие Discord + временная категория по шаблону (tournament, playtest, stream); в конце сама уходит в архив
      - `/poll` · модераторы — нативный опрос Discord: вопрос, варианты по строке (можно с эмодзи в начале), часы, несколько ответов
      - `/slowmode seconds [for]` · модераторы — медленный режим; с `for` (30m, 2h) вернётся сам
      - `/emojimode on · off [user] [for]` · модераторы — только эмодзи в канале (команду не трогает) или, с `user`, одному участнику везде
      - `/fund …` · админы — сбор на серверы · `/supporter show·hide` — список благодарностей
      - `/room lock · unlock · limit · name · kick · owner` · владелец комнаты, модераторы — управлять комнатой Duo/Trio

      **Автоматика**: приветствие после правил в {#💬・chat} (и в {#💬・чат} для RU) · комнаты Duo/Trio · патчноуты и статус сервера · полоска сбора в 🌐・server-status · фильтр media · mod-log · трекер приглашений · баг-репорты из лаунчера и игры (включатся после выкладки бэкенда).

      Бот работает на той же VM, что и бэкенд. На одной базе — только один процесс бота: второй не запустится.

  hb_config:
    title: "⚙️ Config and scripts (admins)"
    tags: [Config]
    translations: { ru: hb_config_ru }
    content: |
      - `server.yaml` — categories, channels, permissions, roles, onboarding, rules screening, AutoMod, server settings, info texts and translations
      - `setup_server.py` — brings the server to `server.yaml`; without `--apply` it only shows the plan
      - `audit.py` — read-only dump: roles, channels, permissions, activity
      - `bot/bot.toml` — bot modules; no section = module off
      - `server-guide.md` — Server Guide texts (set by hand)
      - `docs/bug-report-api.md` — bug report contract: launcher → backend → bot

      **Changing the server**
      1. Edit `server.yaml`. Renames via `was:` (old name), or you get a duplicate. Old channels go to `archive:`, not deleted.
      2. `python setup_server.py` — check the plan changes only what you meant.
      3. `python setup_server.py --apply`. Changed texts are edited in place; translation threads and buttons stay.
      4. After editing `bot.toml`, restart the bot.

      **Production**: fresh `audit.py` and plan, then the owner's OK. Everything new is tested on the test server first.

      Discord doesn't let bots do these: Server Guide, the legacy "Block Mention Spam" AutoMod rule, 2FA for moderators — by hand.
  hb_config_ru:
    content: |
      - `server.yaml` — категории, каналы, права, роли, адаптация, правила при входе, AutoMod, настройки сервера, инфо-тексты и переводы
      - `setup_server.py` — приводит сервер к `server.yaml`; без `--apply` только показывает план
      - `audit.py` — выгрузка только для чтения: роли, каналы, права, активность
      - `bot/bot.toml` — модули бота; нет секции — модуль выключен
      - `server-guide.md` — тексты путеводителя (заполняется руками)
      - `docs/bug-report-api.md` — контракт баг-репортов: лаунчер → бэкенд → бот

      **Как менять сервер**
      1. Правка в `server.yaml`. Переименование — через `was:` (старое имя), иначе появится дубль. Старые каналы — в `archive:`, не удалять.
      2. `python setup_server.py` — проверить, что меняется только задуманное.
      3. `python setup_server.py --apply`. Изменившиеся тексты правятся на месте, ветки и кнопки переводов сохраняются.
      4. После правки `bot.toml` — перезапустить бота.

      **Боевой сервер**: свежий `audit.py` и план, затем «да» владельца. Всё новое — сначала на тестовом сервере.

      Это Discord ботам не даёт: путеводитель, старое правило AutoMod «Block Mention Spam», 2FA для модераторов — руками.

  hb_prompts_posts:
    title: "✨ AI prompts: posts"
    tags: [AI prompts]
    translations: { ru: hb_prompts_posts_ru }
    content: |
      Copy, fill in `<…>`, then run the review prompt. AI drafts, a person publishes.

      **Announcement**
      ```
      Write an announcement for the Dungeonborne Community Discord (a fan community server). Channel: <announcements | test-announcements>.
      Facts (add nothing else; ask if something is missing): <what, when with date, time and timezone, what players should do>.
      Discord markdown: "# headline = what happened", 1–2 sentences, "## What it means for you", "## What to do", last line "-# Discuss → {#💬・chat}".
      Times only as <t:UNIX:F> and <t:UNIX:R> — show how you computed UNIX. Channel links like {#🚀・how-to-play}. Up to 1500 characters, no @everyone, no pings.
      Give two blocks: ENGLISH (the post) and RUSSIAN (natural, not word-for-word).
      ```
      **Patch notes entry**
      ```
      Write a patch_notes.toml entry for the Dungeonborne server from: <commits or release notes>. Invent nothing.
      [[update]] with version, date (YYYY-MM-DD), title and new / fixed / balance in Russian, then [update.lang.en] with the same fields in English.
      Plain player-facing text, no internal names, hashes or markdown. List anything not deployed or not verified separately after the entry.
      ```
      **Review** — see the next post.
  hb_prompts_posts_ru:
    content: |
      Скопируй, заполни `<…>`, потом прогони запрос проверки. ИИ пишет черновик, публикует человек.

      **Анонс** — запрос на английском выше: ИИ отдаст два блока, ENGLISH для поста и RUSSIAN для поля перевода в `/announce`.
      **Запись списка изменений** — запрос выше; результат вставить в начало `seasons/<сезон>/patch_notes.toml`.
      Запросы можно писать и по-русски — смысл тот же: только данные факты, метки времени, без пингов, два языка.

  hb_prompts_support:
    title: "✨ AI prompts: support, moderation, review"
    tags: [AI prompts]
    translations: { ru: hb_prompts_support_ru }
    content: |
      **Answer a player in help** (helpers)
      ```
      Help me answer a player in the Dungeonborne Community support forum. Question: <paste>. Reply in: <player's language>.
      Use only this FAQ / how-to-play section: <paste>. Short, friendly, 1–3 steps. If the cause is unclear, ask for the battle number from the ping line, relay.log and launcher.log.
      No promises or dates. Never ask for passwords or payment details; private matters go to a ticket.
      ```
      **Warning in chat** (moderators)
      ```
      Write a Discord chat warning in <channel language>. What happened: <description>. Rule #<n>: <rule text>.
      One calm line, no judgement of the person: what's wrong, the rule number, where to post instead. No threats or sarcasm; disputes go to a ticket.
      ```
      **Translate an info post**
      ```
      Translate this Dungeonborne Community Discord text from <English> to <language>. Keep markdown (#, ##, -#, lists, bold), {#channel} and {@role} links, <t:…> timestamps, game names as in the game's localization. Natural player tone; add or drop nothing; under 2000 characters. Text: <paste>
      ```
      **Review a draft**
      ```
      Review this draft against the rules and list problems, don't rewrite: 1) facts, dates or numbers not in the source <paste>; 2) times as <t:…> with correct UNIX; 3) headline says what happened, there's a "what to do"; 4) ≤1500 characters, no @everyone, no personal data or closed-channel info; 5) English and translation say the same. Draft: <paste>
      ```
  hb_prompts_support_ru:
    content: |
      Запросы выше на английском, но их можно давать ИИ и по-русски.
      - **Ответ игроку** — для хелперов: только по FAQ, 1–3 шага, при неясной причине просить номер боя и логи, без обещаний и сроков, без паролей.
      - **Предупреждение** — для модераторов: одна спокойная строка, номер правила, куда писать вместо этого.
      - **Перевод** — сохранить markdown, ссылки, метки времени и игровые названия.
      - **Проверка черновика** — ИИ возвращает список проблем по 5 пунктам, а не новый текст.
      Правка инфо-текстов (`server.yaml`) — в посте «Config and scripts».

  hb_todo:
    title: "🧾 To do and manual settings"
    tags: [To do]
    translations: { ru: hb_todo_ru }
    content: |
      **By hand (bots can't)**
      - Server Guide — texts in `server-guide.md`
      - AutoMod "Block Mention Spam": limit 6, raid protection, block, alert to mod-log, 10 min timeout
      - 2FA for moderators — only the owner with 2FA enabled
      - Production bot: Server Members and Message Content intents in the Developer Portal

      **Needs a decision or text**
      - "Team" and "Plans" on the site
      - Boosty and Patreon links
      - Who gets Lead Moderator

      **Not done yet**
      - Production server migration: audit, plan, production `bot.toml`, bot on the VM, server status fix, invites per source; give EN to current members before ENGLISH is locked
      - Bug reports end to end: backend on the VM → enable the bot module; in-game "Support" button pack
      - FAQ from the site's Help as the single source
      - Discord link on the site and in the launcher; online widget on the site
      - `/profile` and Linked Roles, the framework's own Discord
  hb_todo_ru:
    content: |
      **Руками (боты не могут)**
      - Путеводитель — тексты в `server-guide.md`
      - AutoMod «Block Mention Spam»: лимит 6, защита от рейдов, блок, уведомление в mod-log, тайм-аут 10 мин
      - 2FA для модераторов — только владелец с включённой 2FA
      - Боевой бот: права Server Members и Message Content в Developer Portal

      **Нужно решение или текст**
      - «Команда» и «Планы» на сайте
      - Ссылки на Boosty и Patreon
      - Кто получает Lead Moderator

      **Ещё не сделано**
      - Переезд боевого сервера: аудит, план, боевой `bot.toml`, бот на VM, починка статуса, приглашения по источникам; выдать EN текущим участникам до закрытия ENGLISH
      - Баг-репорт целиком: бэкенд на VM → включить модуль бота; пак на кнопку «Поддержка» в игре
      - FAQ из «Помощи» сайта как единый источник
      - Ссылка на Discord на сайте и в лаунчере; виджет онлайна на сайте
      - `/profile` и Linked Roles, отдельный Discord фреймворка


  hb_style:
    title: "✍️ Writing style"
    tags: [Rules]
    translations: { ru: hb_style_ru }
    content: |
      We write as a player talking to players: short, concrete, friendly. Russian uses informal «ты», like the site.

      - **Voice** — no corporate or marketing phrasing: "We are pleased to announce the release of the update" → "The update is out". English in plain words: many readers aren't native.
      - **Order** — most important first, details after. One idea per sentence. A list when there are 3+ items.
      - **Discord markdown** — `#` only for the headline of an info post or announcement, `##` for sections, `-#` for footnotes. **Bold** for key words, not whole sentences. One emoji in a headline, not in every line.
      - **Time and numbers** — times as `<t:UNIX:F>`, digits instead of words, units with a space: `3 min`, `10 000 gold`.
      - **Channels** — as links, not words. Channel names: `emoji・name`, lowercase.
      - **We don't write** — promises without a date from the developer; "soon" without context; sarcasm about players; comparisons with the official servers or the developers.

      **Glossary** — the same thing always has the same name:
      - Fighter · Rogue · Priest · Pyromancer · Swordmaster · Druid · Death Knight · Cryomancer
      - Sinner's End · Clouseau Castle · Normal · Classic · Hard
      - launcher · instance · raid · season · playtest · wipe · battle number · ping line · battle bypass
      - stash · blue portal · relic · auction · ticket · helper · creator

      Russian names are in the translation below. A new term goes into the glossary first, then into the base prompt.
  hb_style_ru:
    content: |
      Пишем как игрок для игроков: коротко, по делу, дружелюбно. По-русски — на «ты», как на сайте.

      - **Голос** — без канцелярита и маркетинга: «Мы рады сообщить о выходе обновления» → «Вышло обновление».
      - **Порядок** — сначала главное, потом детали. Одна мысль — одно предложение. Список — если пунктов 3 и больше.
      - **Оформление** — `#` только заголовок инфо-поста или анонса, `##` разделы, `-#` сноски. **Жирный** — ключевые слова, не целые фразы. Эмодзи — один в заголовке, не в каждой строке.
      - **Время и числа** — метками `<t:UNIX:F>`, цифрами, единицы через пробел: `3 мин`, `10 000 золота`.
      - **Каналы** — ссылкой, не словами.
      - **Не пишем** — обещания без даты от разработчика, «скоро» без контекста, сарказм в адрес игроков, сравнения с официальными серверами и разработчиками.

      **Глоссарий EN = RU**
      - Fighter = Боец · Rogue = Разбойник · Priest = Жрец · Pyromancer = Пиромант
      - Swordmaster = Мастер меча · Druid = Друид · Death Knight = Рыцарь смерти · Cryomancer = Криомант
      - Sinner's End = Кончина грешника · Clouseau Castle = Замок Клузо · Normal = Обычный (Classic, Hard — как есть)
      - launcher = лаунчер · instance = инстанс · raid = рейд · season = сезон · playtest = плейтест · wipe = вайп
      - battle number = номер боя · ping line = строка пинга · battle bypass = обход для боёв
      - stash = тайник · blue portal = синий портал · relic = реликвия · auction = аукцион
      - ticket = тикет · helper = хелпер · creator = автор

  hb_prompt_base:
    title: "✨ AI prompts: base prompt (always first)"
    tags: [AI prompts]
    translations: { ru: hb_prompt_base_ru }
    content: |
      Paste this before any prompt from the other AI posts, or save it as project instructions in your AI tool.
      ```
      You write for Dungeonborne Community — a player-run community server for the game Dungeonborne, a fan project not affiliated with the developers or the publisher. Readers are players; English is the server language, Russian is the second.
      Voice: a player talking to players. Short, concrete, friendly. No corporate or marketing phrasing. Most important first, one idea per sentence. Plain English. Russian: informal "ты", natural, never word-for-word.
      Discord markdown: "#" only for an info post or announcement headline, "##" sections, "-#" footnotes, bold only key words, lists for 3+ items, one emoji in a headline. Times only as <t:UNIX:F> / <t:UNIX:R>. Digits, units with a space. Channel links as {#emoji・name}.
      Facts only from what I give you; ask if something is missing. Never invent dates, numbers, features or promises. No @everyone or role pings. No personal data, nothing from tickets, the playtest or the creator hub. No comparisons with the official servers or the developers.
      Glossary EN = RU: Fighter = Боец, Rogue = Разбойник, Priest = Жрец, Pyromancer = Пиромант, Swordmaster = Мастер меча, Druid = Друид, Death Knight = Рыцарь смерти, Cryomancer = Криомант; Sinner's End = Кончина грешника, Clouseau Castle = Замок Клузо; Normal = Обычный; launcher = лаунчер, instance = инстанс, raid = рейд, wipe = вайп, battle number = номер боя, ping line = строка пинга, battle bypass = обход для боёв, stash = тайник, blue portal = синий портал, relic = реликвия, ticket = тикет.
      ```
  hb_prompt_base_ru:
    content: |
      Вставляй этот промпт перед любым запросом из других постов про ИИ или сохрани его как инструкцию проекта в своём ИИ-инструменте.
      Он задаёт голос сообщества (на «ты», без канцелярита), оформление Discord, глоссарий и запреты: ничего не выдумывать, без пингов, без личных данных и закрытой информации.
      Промпт на английском специально: так ИИ одинаково понимает его, на каком бы языке ты ни писал задачу дальше.

  hb_agent:
    title: "🤖 AI agent for announcements"
    tags: [AI prompts]
    translations: { ru: hb_agent_ru }
    content: |
      An admin says one line — "write an announcement for the weekend tournament" — and the agent gathers context, asks what's missing in one list and returns a draft for `/announce`. A person always publishes.

      **Setup**
      - **Claude Code in the Discord project folder** — nothing to do: the skill `.claude/skills/discord-announce/SKILL.md` picks up "write an announcement" by itself.
      - **Claude in the browser or app** — a project "Dungeonborne announcements": instructions = base prompt + the agent block from the handbook doc; project files = `server.yaml` and `bot/bot.toml`.
      - **Another AI** — base prompt + agent block as the first message.

      **What the agent does**
      1. Reads channels, roles, the channel template and the style guide — no questions.
      2. Asks what's missing in one numbered list, with defaults: dates and timezone, format (duo or trio, map, mode), rules, prizes, sign-up. "Like in the original" is not a source: it asks for the rules or a link and never calls our event official.
      3. Drafts by the channel template, times as `<t:…>` with the calculation shown, up to 1500 characters, no pings.
      4. Checks itself, then returns: channel and ping role · ENGLISH block · RUSSIAN block · what to double-check.

      **Then** `/announce` → paste both blocks → preview → second-person review → Post.
  hb_agent_ru:
    content: |
      Администратор говорит одну фразу — «напиши анонс про турнир в выходные», — а агент сам собирает контекст, одним списком спрашивает недостающее и отдаёт черновик для `/announce`. Публикует всегда человек.

      **Подключение**
      - **Claude Code в папке проекта Discord** — ничего не нужно: скилл `.claude/skills/discord-announce/SKILL.md` подхватывается сам по фразе «напиши анонс».
      - **Claude в браузере или приложении** — проект «Dungeonborne анонсы»: инструкции = базовый промпт + блок агента из документа handbook; файлы проекта — `server.yaml` и `bot/bot.toml`.
      - **Другой ИИ** — базовый промпт и блок агента первым сообщением.

      **Что делает агент**
      1. Читает каналы, роли, шаблон канала и гайд по стилю — без вопросов.
      2. Одним списком спрашивает недостающее, с вариантами по умолчанию: даты и часовой пояс, формат (дуо или трио, карта, режим), правила, призы, регистрация. «Как в оригинале» — не источник: просит правила или ссылку и не называет наш ивент официальным.
      3. Пишет по шаблону канала, время — метками `<t:…>` с расчётом, до 1500 символов, без пингов.
      4. Проверяет себя и отдаёт: канал и роль для пинга · блок ENGLISH · блок RUSSIAN · что перепроверить.

      **Дальше** `/announce` → вставить оба блока → предпросмотр → вычитка вторым человеком → «Опубликовать».

  hb_announce_flow:
    title: "📣 How we publish an announcement"
    tags: [Rules]
    translations: { ru: hb_announce_flow_ru }
    content: |
      1. **Ask** — "write an announcement about …, RU and CN, rules as a card".
      2. **Sources** — config, patch notes, the game client strings (`names/strings_en.tsv`, `strings.tsv` — the original modes' rules), the web. Missing facts → one list with defaults.
      3. **Draft** — `drafts/<name>.md`: `## ENGLISH`, `## RUSSIAN`, `## 中文`, one text block each; rules after `---rules---` become a card.
      4. **Check** — `python post_announcement.py drafts/<name>.md --channel announcements --ping Events --as-owner` (nothing is posted without `--publish`).
      5. **Publish** — same command with `--publish`, or double-click a `.bat` like `post_announcement.bat`: check → "Publish now? (y/n)".
      6. **Look in Discord** — author, text, card, 🌍 thread, language buttons. Fix in place with `-# Upd: …`.

      **Flags:** `--as-owner` posts with the owner's name and avatar via a webhook (shows an APP tag) · `--delete-after 7d` removes the post and its thread later · `--guild` another server — production only with the owner's OK on that text.

      **Delete later** for any message: right-click → Apps → Delete later → `30m`, `12h`, `7d` (`0` cancels). `/announce` has `delete_after` too.

      **Never** publish with a personal Discord token (self-bot — Discord bans accounts for it).
  hb_announce_flow_ru:
    content: |
      1. **Просьба** — «напиши анонс про …, нужны RU и CN, правила карточкой».
      2. **Источники** — конфиг, патчноуты, строки клиента игры (`names/strings_en.tsv`, `strings.tsv` — правила режимов оригинала), интернет. Чего нет — один список вопросов с вариантами по умолчанию.
      3. **Черновик** — `drafts/<имя>.md`: `## ENGLISH`, `## RUSSIAN`, `## 中文`, в каждом блок текста; правила после `---rules---` станут карточкой.
      4. **Проверка** — `python post_announcement.py drafts/<имя>.md --channel announcements --ping Events --as-owner` (без `--publish` ничего не публикуется).
      5. **Публикация** — та же команда с `--publish` или двойной щелчок по `.bat` вроде `post_announcement.bat`: проверка → «Publish now? (y/n)».
      6. **Посмотреть в Discord** — автор, текст, карточка, ветка 🌍, кнопки языков. Правки — на месте, с `-# Upd: …`.

      **Флаги:** `--as-owner` — от имени владельца через вебхук (рядом значок «БОТ») · `--delete-after 7d` — удалить пост с веткой через срок · `--guild` — другой сервер; боевой — только с «да» владельца на этот текст.

      **Удалить позже** любое сообщение: ПКМ → Приложения → Delete later → `30m`, `12h`, `7d` (`0` — отмена). У `/announce` есть `delete_after`.

      **Никогда** не публиковать через личный токен Discord (self-bot — Discord банит за это аккаунты).
