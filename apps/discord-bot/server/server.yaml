# Messages are posted by the bot, once: without pin — into an empty channel; pin — if the channel has no bot pin; forum — a post with title.
# The main text is in English. translations: {language: key} — the translation: in a channel — in a "🌍 …" thread under the message,
# in a forum — as the next message in the post. New language: add it to languages and to translations — the script adds what is missing.
# content — Discord markdown: # ## ### headings, -# small text, lists, [link](url); no longer than 2000 characters.
# Link previews are off (previews: true — turn on). embeds — only the sample card in forum posts.
# {#channel} — channel link, {@role} — role link without a ping, {server} — server name.
messages:
  # 🏛️・about: who we are (on behalf of the community) → the developer's mission (first person, based on the 04.11 post) → where to go
  about:
    translations: { ru: about_ru }
    content: |
      # 🏛️ About Dungeonborne Community
      We're players who want to keep playing a good game. The official servers are gone, so we keep **Dungeonborne** alive ourselves.

      ## What's here
      - **A free community server** with its own launcher: it signs you in with Discord, installs fixes and mods, and gets you into the game
      - **Playtests and seasons**: we test changes together, and your bug reports and ideas shape what comes next
      - **An open framework** (in development) to run and mod your own Dungeonborne server
      - **The community**: guides, groups, events and creators

      ## What we stand for
      - **No monetization.** Playing is free: no paid access, no pay-to-win. Donations go to the project: first the server bill, extra builds a one-month server reserve, and anything beyond that thanks the team. Support us on [Patreon](https://www.patreon.com/dungeonbornecommunity) or [Boosty](https://boosty.to/your-blog). They give nothing in the game.
      - **Open.** The framework will be open source once the core is finished, and other community servers are welcome.
      - **A fan project**, not affiliated with the developers or the publisher of the game.

      ## How you can help
      Play and report bugs in {#🐛・bug-reports} · share ideas in {#💡・ideas} · write guides in {#📚・guides} · make videos · help newcomers as a Helper ({#🎫・tickets}).
  about_ru:
    content: |
      # 🏛️ О Dungeonborne Community
      Мы — игроки, которые хотят и дальше играть в хорошую игру. Официальных серверов больше нет, поэтому **Dungeonborne** живёт благодаря нам.

      ## Что здесь есть
      - **Бесплатный сервер сообщества** со своим лаунчером: вход через Discord, исправления и моды ставятся сами, игра подключается к серверу
      - **Плейтесты и сезоны**: изменения проверяем вместе, а твои баг-репорты и идеи определяют, что будет дальше
      - **Открытый фреймворк** (в разработке), чтобы поднять и моддить свой сервер Dungeonborne
      - **Сообщество**: гайды, поиск группы, ивенты и авторы

      ## Наши принципы
      - **Без монетизации.** Играть бесплатно: никакого платного доступа и pay-to-win. Пожертвования получает проект: сначала они оплачивают серверы, сверх этого копится резерв на месяц серверов, а всё, что больше, — благодарность команде. Поддержать: [Patreon](https://www.patreon.com/dungeonbornecommunity) или [Boosty](https://boosty.to/your-blog). В игре они ничего не дают.
      - **Открытость.** Фреймворк станет открытым, когда будет готово ядро; другим серверам сообщества мы рады.
      - **Фан-проект**, не связан с разработчиками и издателем игры.

      ## Как помочь
      Играй и сообщай о багах в {#🐛・bug-reports} · делись идеями в {#💡・ideas} · пиши гайды в {#📚・guides} · снимай видео · помогай новичкам как Helper ({#🎫・tickets}).

  mission:
    translations: { ru: mission_ru }
    content: |
      ## 🎯 Development mission
      **1. The game works 100%.** Before touching class or weapon balance, the base game has to run stable: no bugs, no disconnects.
      **2. The limits of modding.** We're digging into the code and assets to see how far the game can be changed.
      **3. An AI framework for every one of you.** Instead of endless small fixes by hand, we're building an open framework with AI integration: anyone will be able to run their own server with their own rules, their own balance — even their own dragon.
  mission_ru:
    content: |
      ## 🎯 Миссия разработки
      **1. Игра работает на 100%.** Прежде чем трогать баланс классов и оружия, базовая игра должна работать стабильно: без багов и отвалов.
      **2. Пределы моддинга.** Копаем вглубь кода и ассетов, чтобы понять, насколько сильно можно менять игру.
      **3. AI-фреймворк для каждого из вас.** Вместо бесконечных мелких правок руками делаем открытый фреймворк с интеграцией ИИ: каждый сможет поднять свой сервер со своими правилами, балансом — да хоть со своим драконом.

