[package]
name = "discord-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
futures = "0.3.34"
poise = "0.7.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# та же версия и движок, что в dbserver-rs: встроенная SurrealKV, без отдельного сервера БД
surrealdb = { version = "2.7", features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.8"
