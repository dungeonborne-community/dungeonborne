[package]
name = "devkit"
version = "0.1.0"
description = "Dungeonborne DevKit: workspace check, machine setup, secrets, backups"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "devkit"
path = "src/lib.rs"

[[bin]]
name = "DevKit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ws-core.workspace = true
