<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Three portals: blue, red and purple">
  <!-- Our own drawing for the site (not from the game): a hall with three portals. Animation — CSS inside, off with reduced-motion. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a07"/>
      <stop offset="1" stop-color="#1a140e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1610"/>
      <stop offset="1" stop-color="#0b0907"/>
    </linearGradient>
    <pattern id="bricks" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 .5h48M0 12.5h48M.5 0v12M24.5 12v12" stroke="#ffffff" stroke-opacity=".035" fill="none"/>
    </pattern>
    <radialGradient id="pb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e6f6ff"/>
      <stop offset=".25" stop-color="#7cc8ff"/>
      <stop offset=".7" stop-color="#1f5fb8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0a1a33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0e0"/>
      <stop offset=".25" stop-color="#ff8a5c"/>
      <stop offset=".7" stop-color="#b8261c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#330a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6ecff"/>
      <stop offset=".25" stop-color="#c39bff"/>
      <stop offset=".7" stop-color="#6232b8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#1a0b33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".7">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <!-- arch opening: an equilateral pointed arch -->
    <clipPath id="a1"><path d="M65 360V240A130 130 0 0 1 130 127.4 130 130 0 0 1 195 240V360z"/></clipPath>
    <clipPath id="a2"><path d="M235 360V210A170 170 0 0 1 320 62.8 170 170 0 0 1 405 210V360z"/></clipPath>
    <clipPath id="a3"><path d="M445 360V240A130 130 0 0 1 510 127.4 130 130 0 0 1 575 240V360z"/></clipPath>
  </defs>
  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 18 26; animation: flow 6s linear infinite; }
    .flow.r { animation-duration: 4.5s; animation-direction: reverse; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .d1 { animation-delay: -1.3s; } .d2 { animation-delay: -2.6s; }
    .ember { animation: rise 6s linear infinite; opacity: 0; }
    @keyframes flow { to { stroke-dashoffset: -176; } }
    @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--dx, 8px), -170px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse, .ember { animation: none; } .ember { opacity: .5; } }
  </style>

  <!-- wall and floor -->
  <rect width="640" height="360" fill="url(#wall)"/>
  <rect width="640" height="360" fill="url(#bricks)"/>
  <rect y="360" width="640" height="80" fill="url(#floor)"/>
  <path d="M320 360L-40 440M320 360L120 440M320 360L240 440M320 360L400 440M320 360L520 440M320 360L680 440M0 384h640M0 412h640" stroke="#ffffff" stroke-opacity=".04"/>
  <path d="M0 360.5h640" stroke="#6b5638" stroke-opacity=".5"/>

  <!-- glow of the portals on the wall and floor -->
  <ellipse cx="130" cy="280" rx="80" ry="110" fill="#3b8cff" opacity=".22" filter="url(#blur)" class="pulse"/>
  <ellipse cx="320" cy="250" rx="110" ry="150" fill="#ff5a3c" opacity=".25" filter="url(#blur)" class="pulse d1"/>
  <ellipse cx="510" cy="280" rx="80" ry="110" fill="#9a63ff" opacity=".22" filter="url(#blur)" class="pulse d2"/>
  <ellipse cx="130" cy="372" rx="70" ry="9" fill="#5aa8ff" opacity=".45" filter="url(#soft)"/>
  <ellipse cx="320" cy="374" rx="95" ry="11" fill="#ff7a4c" opacity=".5" filter="url(#soft)"/>
  <ellipse cx="510" cy="372" rx="70" ry="9" fill="#b07cff" opacity=".45" filter="url(#soft)"/>

  <!-- openings: dark, the portals inside -->
  <g clip-path="url(#a1)">
    <rect x="60" y="120" width="140" height="240" fill="#07060a"/>
    <ellipse cx="130" cy="276" rx="44" ry="74" fill="url(#pb)" class="pulse"/>
    <ellipse cx="130" cy="276" rx="36" ry="62" stroke="#bfe6ff" class="flow"/>
    <ellipse cx="130" cy="276" rx="24" ry="44" stroke="#e6f6ff" stroke-opacity=".7" class="flow r"/>
  </g>
  <g clip-path="url(#a2)">
    <rect x="230" y="60" width="180" height="300" fill="#0a0606"/>
    <ellipse cx="320" cy="252" rx="62" ry="100" fill="url(#pr)" class="pulse d1"/>
    <ellipse cx="320" cy="252" rx="52" ry="86" stroke="#ffd2b8" class="flow"/>
    <ellipse cx="320" cy="252" rx="36" ry="62" stroke="#fff0e0" stroke-opacity=".7" class="flow r"/>
    <ellipse cx="320" cy="252" rx="20" ry="36" stroke="#fff0e0" stroke-opacity=".5" class="flow"/>
  </g>
  <g clip-path="url(#a3)">
    <rect x="440" y="120" width="140" height="240" fill="#08060c"/>
    <ellipse cx="510" cy="276" rx="44" ry="74" fill="url(#pp)" class="pulse d2"/>
    <ellipse cx="510" cy="276" rx="36" ry="62" stroke="#e2d0ff" class="flow"/>
    <ellipse cx="510" cy="276" rx="24" ry="44" stroke="#f6ecff" stroke-opacity=".7" class="flow r"/>
  </g>

  <!-- stone arch frames with a gold edge -->
  <g fill="none" stroke-linejoin="round">
    <path d="M65 360V240A130 130 0 0 1 130 127.4 130 130 0 0 1 195 240V360" stroke="#2a221a" stroke-width="16"/>
    <path d="M235 360V210A170 170 0 0 1 320 62.8 170 170 0 0 1 405 210V360" stroke="#2a221a" stroke-width="18"/>
    <path d="M445 360V240A130 130 0 0 1 510 127.4 130 130 0 0 1 575 240V360" stroke="#2a221a" stroke-width="16"/>
    <g stroke="#6b5638" stroke-width="1.5">
      <path d="M57 360V240A146 146 0 0 1 130 113.6 146 146 0 0 1 203 240V360"/>
      <path d="M226 360V210A188 188 0 0 1 320 47.2 188 188 0 0 1 414 210V360"/>
      <path d="M437 360V240A146 146 0 0 1 510 113.6 146 146 0 0 1 583 240V360"/>
    </g>
    <g stroke="#e0a84a" stroke-opacity=".55" stroke-width="1">
      <path d="M73 360V240A114 114 0 0 1 130 141.3 114 114 0 0 1 187 240V360"/>
      <path d="M244 360V210A152 152 0 0 1 320 78.4 152 152 0 0 1 396 210V360"/>
      <path d="M453 360V240A114 114 0 0 1 510 141.3 114 114 0 0 1 567 240V360"/>
    </g>
  </g>
  <!-- keystones -->
  <path d="M130 106l7 10h-14zM320 38l9 12h-18zM510 106l7 10h-14z" fill="#e0a84a" opacity=".8"/>

  <!-- sparks -->
  <g fill="#ffb066">
    <circle class="ember" cx="300" cy="350" r="1.6" style="--dx:-12px"/>
    <circle class="ember" cx="345" cy="352" r="1.3" style="--dx:10px;animation-delay:-2s"/>
    <circle class="ember" cx="320" cy="346" r="1.1" style="--dx:16px;animation-delay:-4s"/>
    <circle class="ember" cx="128" cy="352" r="1.2" style="--dx:-8px;animation-delay:-1s;fill:#9cd2ff"/>
    <circle class="ember" cx="512" cy="352" r="1.2" style="--dx:9px;animation-delay:-3s;fill:#d5b8ff"/>
  </g>

  <rect width="640" height="440" fill="url(#vig)"/>
</svg>
