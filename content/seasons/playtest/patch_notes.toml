[update.lang.en]
title = "November 12 update"
new = [
  "Wipe: progress is reset. Log in to the launcher again through Discord and create a character — level 1, with grey starter gear and 10,000 gold.",
  "Launcher instances by party size: solo (up to 3 at once), duo (up to 2) and trio. No minimum any more: an instance starts once it is full, or after 8 minutes with whoever joined. You can vote for the map during the whole gathering. As soon as an instance starts, the next one opens. The hall waits 3 minutes. Requires launcher 1.7.1 — it updates itself.",
  "Launcher 1.7.1: new \"Torch\" look (choose \"Torch\", \"Crypt\" or \"Blood\" in Settings), the game folder is found automatically, \"Browse…\" picks it by hand.",
  "Launcher 1.7.1: server description, message of the day and maintenance notices in the launcher language; the blocking bypass switch in Settings → Network is visible before login.",
  "Custom games: after an arena match a scoreboard opens — kills, deaths, damage and healing of every player.",
]
fixed = [
  "Arenas: if the whole enemy team leaves, the match ends with a win for those who stayed.",
  "Arenas: players no longer spawn together in the middle of the map — each team spawns at its own base.",
]
balance = [
  "Arenas: you cannot bring your own consumables or backpack items — only the gear you wear. Everything stays with you after the match.",
  "Unique items drop from the Monarch and the Wendigo on Classic (0.5%) and Hard (1%); from anything else — extremely rarely.",
  "Legendary items are much more common: Monarch and Wendigo 0.5 / 2.5 / 5% (normal / Classic / Hard), less from other bosses, goblin thieves, elites and special chests.",
  "Pink set armor: 33 / 50 / 100% from any boss, rarer from goblin thieves, elites and special chests.",
  "Epic items: more from elites, fewer from regular chests and monsters.",
  "Bosses no longer drop blue, green or grey items. Barrels, crates and pots drop no gear.",
  "A fixed number of items per drop: monster 0.5, chest 2, mimic 2.5, goblin thief and elite 3, special chests and altars 3.5, boss 5.",
  "Four times more consumables and ingredients. Instead of gold, loot now gives blood and herbs (gold piles on the floor stay).",
  "Seals: regular 20%, legendary 2%. The legendary seal altar gives one treasure, golden half of the time.",
  "Set bonus on epic items: always from bosses, about one in five from elites, never from other sources or the merchant.",
  "Ice staffs are removed from loot. Legendary and unique items without their own effect are removed from the market.",
