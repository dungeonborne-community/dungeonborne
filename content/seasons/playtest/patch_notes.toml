# Changelog of the season "Playtest": the "Changelog" tab in the launcher (src/auth/notes.rs).
# Served when the backend runs with SEASON=playtest (on the VM: <launch folder>/seasons/playtest/). The server re-reads it by itself.
#
# New entry goes on top: [[update]] with date (YYYY-MM-DD), title and at least one item in new, fixed or balance.
# Entry translation — subtable [update.lang.en] with the same fields; whatever is missing there, the player sees in Russian.
# version is optional; by it (or by date) the launcher decides that an entry is new. Items are plain text for players.
#
# 07.11 — based on the facts of the deploy (FIX_LIST "Deploy 07.11", clarifications from the "Agent orchestrator" session):
# - returning gear to teammates is deployed, but not checked in a live game with two players;
# - the crash fix is deployed but not proven, hence "a frequent cause";
# - auto-sell on extraction remains only in the Dead Money season, which is off on prod.

lang = "ru"   # language of the main text

