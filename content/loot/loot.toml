# Шаблон лута. Правите этот файл, затем:
#   cargo xtask loot show             — что в среднем выпадает из каждой группы (с учётом [rules])
#   cargo xtask loot build [--deploy] — шаблон -> balance\loot*.json -> сервер + клиентский пак
# Подробно — BALANCE.md, раздел «Лут».
#
# [groups.*]  группа источников с одинаковым лутом: sources — сундуки/монстры (имя BP из loot_source_map или id),
#             slots — броски: каждый слот независимо выпадает с шансом chance (%), из пула pool — ОДИН предмет.
#             Слот можно повторить — будет два броска. pools = [a, b] + pr = [70, 30] — выбор пула по весам.
#             id слота можно не писать (новый слот получит id сам).
#             maps = [10101, 10201] — на каких картах (map_detail.loot_map_id: 10101/10102/10103 — Склеп
#             обычн./Classic/Hard, 10201/10202/10203 — Замок); без maps — карта 0, лут по умолчанию.
#             loot_types = [0, 1, …] — варианты лута карты (у PVE 1–5 почти копии 0; 3/4 — с алтарями).
# [pools.*]   пул: items — { id, w, cnt, level }. id — число или имя предмета («Золото»). w — вес внутри пула
#             (относительный, при сборке приводится к сумме 30000). cnt — количество: число или список
#             ([3, 5, 8] — равновероятно одно из), по умолчанию 1. Ключ пула: число (= random_id) или любое имя.
# Категории для [rules]: gold weapon armor jewelry gem treasure potion throwable supply currency other;
#   группы: equipment (weapon+armor+jewelry), consumable (potion+throwable+supply), all.
#   Можно и по-русски: "золото", "сокровища"… (в кавычках).

[rules]
remove = []   # убрать предметы: ["equipment"] — вся экипировка; ["weapon", 100013] — оружие и предмет 100013
chance = {}   # множитель шанса слота по составу его пула: { treasure = 2.0, gold = 1.5 } (не выше 100%)
weight = {}   # множитель веса предметов внутри пулов: { treasure = 3.0 } — в смешанных пулах сокровища чаще
count = {}    # множитель количества: { gold = 2.0 }
quality = 0   # качество дропа: вес предмета с ценой × (цена / средняя цена в пуле) ^ quality (0.5 — дорогое чаще)

# [modes.<имя>] — те же правила (remove/chance/weight/count/quality), но только для своих карт, поверх [rules]:
#   [modes.no_gear]
#   maps = [10101, 10102, 10103]
#   remove = ["equipment", "gold"]

