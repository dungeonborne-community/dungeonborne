[package]
edition = "2021"
name    = "dbserver-rs"
version = "0.1.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = "0.1"
# 11.11: RocksDB instead of SurrealKV — SurrealKV 0.9 does not compact its journal (prod DB 59 GB in 3 days), RocksDB compacts by itself.
# Build: needs libclang (Windows: C:\Program Files\LLVM, WSL: clang).
surrealdb = { version = "2.0", features = ["kv-rocksdb"] }
axum = { version = "0.7", features = ["multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
async-trait = "0.1"
toml = "0.8"
# player login (src/auth): TLS relay, OAuth providers, session tokens
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
sha2 = "0.10"
futures = "0.3"

# cargo xtask … — development tools (balance tables), see xtask/ and BALANCE.md
[workspace]
members = ["xtask", "ds-agent", "crates/balance-kit"]

# Dependencies ONLY for the build.rs script
[build-dependencies]
prost = "0.12"
prost-types = "0.12" # Lets us parse FileDescriptorSet
prost-build = "0.12" # <-- REQUIRED for generating structs
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Profiles (04.11): less debug info — smaller target and faster linking.
# 05.11: incremental is off in both profiles — the target/*/incremental cache grew to 23 GB (debug 20 GB) and
# filled disk G:. Dependencies are still cached by sccache; only our crate is rebuilt.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
incremental = false
