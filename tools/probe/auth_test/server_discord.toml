# Local check of the real Discord login (tools/auth_login.py). The game keeps working as before (require = none).
# Developer Portal → OAuth2 → Redirects must contain http://127.0.0.1:8090/auth/discord/callback
[server]
id = "local.discord.test"
name = "Discord login test"

[game]
exe_sha256 = "62d509a00d984696e021fb5ddba9f87fd1b27c84f695877345ff5fe9401f58b3"   # Binaries\Win64\Dungeonborne.exe, both installs (02.11)
label = "Dungeonborne Win64 final"

[web]
bind = "127.0.0.1:8090"
public_url = "http://127.0.0.1:8090"

[auth]
require = "none"
providers = ["discord"]
# the Discord ban role takes effect from the next login — a short session so that it kicks in sooner
session_ttl_days = 7
# login whitelist: only with the Whitelist role (gm/admin — always); empty/no line — everyone
login_roles = ["whitelist"]

[auth.discord]
client_id = "100000000000000102"
client_secret_env = "DISCORD_CLIENT_SECRET"
guild_id = "100000000000000101"
require_guild = true
invite_url = "https://discord.gg/example"
# roles — from DiscordCFG/cfg.txt; @everyone (= guild_id) is not needed: everyone has the player role
banned_role = "100000000000000103"
[auth.discord.roles]
"100000000000000104" = "gm"      # gm_role
"100000000000000105" = "admin"   # dev_admin_role
"100000000000000106" = "whitelist"   # Whitelist role — login with [auth] login_roles = ["whitelist"]
